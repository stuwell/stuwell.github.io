["Professors","Professeurs","الأساتذة"],["See how each class is doing, as a group.","Voyez comment va chaque classe, en tant que groupe.","شاهد حال كل فصل كمجموعة."],["Know which students may need a kind word.","Sachez quels étudiants ont peut-être besoin d'un mot gentil.","اعرف أي الطلاب قد يحتاجون إلى كلمة طيبة."],["Get simple classroom ideas: what to say and what to do.","Obtenez des idées simples pour la classe : quoi dire et quoi faire.","احصل على أفكار بسيطة للفصل: ماذا تقول وماذا تفعل."],["Sensitive details stay with the director.","Les détails sensibles restent chez le directeur.","التفاصيل الحساسة تبقى لدى المدير."],["Enter professor area","Entrer dans l'espace professeur","ادخل فضاء الأستاذ"],
["Directors and staff","Directeurs et personnel","المديرون والموظفون"],["One overview of well-being across classes.","Une vue d'ensemble du bien-être dans toutes les classes.","نظرة شاملة على الرفاهية عبر الفصول."],["Students sorted by level, with the reasons.","Étudiants classés par niveau, avec les raisons.","الطلاب مرتبون حسب المستوى مع الأسباب."],["Say, do and avoid guidance for every flag.","Conseils sur quoi dire, faire et éviter pour chaque signalement.","إرشادات ما يُقال وما يُفعل وما يُتجنب لكل إشارة."],["Approve or decline requests with a written reply.","Approuvez ou refusez les demandes avec une réponse écrite.","وافق على الطلبات أو ارفضها برد مكتوب."],["Enter director area","Entrer dans l'espace directeur","ادخل فضاء المدير"],
["Privacy and safety","Confidentialité et sécurité","الخصوصية والسلامة"],["Built so students stay in control.","Conçu pour que les étudiants gardent le contrôle.","مصمم ليبقى الطلاب هم المتحكمين."],
["Your check-ins, screener scores and notes.","Vos bilans, scores de dépistage et notes.","تقييماتك ونتائج استبياناتك وملاحظاتك."],["The worry dump, which is never saved at all.","La décharge d'inquiétudes, qui n'est jamais enregistrée.","تفريغ القلق الذي لا يُحفظ أبداً."],["Your individual screener answers, which are never stored.","Vos réponses individuelles aux questionnaires, qui ne sont jamais enregistrées.","إجاباتك الفردية على الاستبيانات والتي لا تُخزَّن أبداً."],
["Your name, school, year, class, check-in scores and screener scores, after you turn sharing on.","Votre nom, votre classe, vos scores de bilan et de dépistage, après activation du partage.","اسمك ومدرستك وسنتك وفصلك ونتائج تقييماتك واستبياناتك بعد تفعيل المشاركة."],["A medical request, only when you press send.","Une demande médicale, uniquement lorsque vous appuyez sur envoyer.","طلب طبي، فقط عندما تضغط على إرسال."],["Never your free text, and you can switch sharing off at any time.","Jamais votre texte libre, et vous pouvez désactiver le partage à tout moment.","لا نصوصك الحرة أبداً، ويمكنك إيقاف المشاركة في أي وقت."],
["StuWell is a self-reflection and support tool. It does not diagnose or treat anything and does not replace a doctor, a psychologist or a counsellor. It is not watched in real time. If you are in danger, use Help now.","StuWell est un outil de réflexion personnelle et de soutien. Il ne diagnostique ni ne traite rien et ne remplace ni un médecin, ni un psychologue, ni un conseiller. Il n'est pas surveillé en temps réel. Si vous êtes en danger, utilisez Aide immédiate.","StuWell أداة للتأمل الذاتي والدعم. لا يشخّص ولا يعالج شيئاً ولا يحل محل الطبيب أو الأخصائي النفسي أو المرشد. ولا تتم مراقبته في الوقت الفعلي. إذا كنت في خطر فاستخدم مساعدة فورية."],
["Good to know before you start.","Bon à savoir avant de commencer.","أمور جيدة لتعرفها قبل البدء."],
["Does my school see my answers?","Mon école voit-elle mes réponses ?","هل ترى مدرستي إجاباتي؟"],["Only if you turn sharing on in your profile. Then staff with access can see your name, school, year, class, check-in scores and screener scores. They never see free text or your individual screener answers.","Seulement si vous activez le partage dans votre profil. Le personnel ayant accès peut alors voir votre nom, votre école, votre année, votre classe, vos scores de bilan et de dépistage. Il ne voit jamais de texte libre ni vos réponses individuelles aux questionnaires.","فقط إذا فعّلت المشاركة في ملفك. عندها يمكن للموظفين المخوّلين رؤية اسمك ومدرستك وسنتك وفصلك ونتائج تقييماتك واستبياناتك. لا يرون النصوص الحرة ولا إجاباتك الفردية على الاستبيانات أبداً."],
["Is this a diagnosis?","Est-ce un diagnostic ?","هل هذا تشخيص؟"],["No. The screeners are standard questionnaires used to decide whether it is worth talking to someone. Only a doctor or psychologist can diagnose anything.","Non. Les questionnaires sont des outils standards pour décider s'il vaut la peine de parler à quelqu'un. Seul un médecin ou un psychologue peut poser un diagnostic.","لا. الاستبيانات أدوات معيارية لتحديد ما إذا كان من المفيد التحدث مع شخص ما. لا يستطيع التشخيص إلا طبيب أو أخصائي نفسي."],
["What if I need help right now?","Que faire si j'ai besoin d'aide tout de suite ?","ماذا لو احتجت إلى مساعدة الآن؟"],["Use Help now at the top of every page. It lists emergency numbers and support lines for Morocco. StuWell is not watched in real time, so never wait for a reply from the app in an emergency.","Utilisez Aide immédiate en haut de chaque page. Elle liste les numéros d'urgence et lignes d'écoute du Maroc. StuWell n'est pas surveillé en temps réel ; n'attendez donc jamais une réponse de l'application en cas d'urgence.","استخدم مساعدة فورية في أعلى كل صفحة. تعرض أرقام الطوارئ وخطوط الدعم في المغرب. لا تتم مراقبة StuWell في الوقت الفعلي، فلا تنتظر رداً من التطبيق أبداً في حالة طارئة."],
["The director replies with approved, declined or a question, and you read the answer in the same tab.","Le directeur répond par approuvé, refusé ou une question, et vous lisez la réponse dans le même onglet.","يرد المدير بالموافقة أو الرفض أو بسؤال وتقرأ الإجابة في القسم نفسه."],
["You write the request in the Medical request tab and press send. The director replies with approved, declined or a question, and you read the answer in the same tab.","Vous rédigez la demande dans l'onglet Demande médicale et appuyez sur envoyer. Le directeur répond par approuvé, refusé ou une question, et vous lisez la réponse dans le même onglet.","تكتب الطلب في قسم الطلب الطبي وتضغط على إرسال. يرد المدير بالموافقة أو الرفض أو بسؤال وتقرأ الإجابة في القسم نفسه."],
["Who can open the director and professor areas?","Qui peut ouvrir les espaces directeur et professeur ?","من يمكنه فتح فضاءي المدير والأستاذ؟"],["Only school staff with a staff account. Everyone else sees a sign-in screen instead.","Seulement le personnel de l'école disposant d'un compte du personnel. Les autres voient un écran de connexion à la place.","فقط موظفو المدرسة الذين لديهم حساب موظفين. يرى الآخرون شاشة تسجيل الدخول بدلاً من ذلك."],

["Thank you for telling us. I am glad you did. You are not in trouble and you do not have to deal with this alone.","Merci de nous l'avoir dit. Je suis content(e) que vous l'ayez fait. Vous n'avez pas de problèmes et vous n'avez pas à affronter cela seul(e).","شكراً لأنك أخبرتنا. يسعدني أنك فعلت. لست في مأزق ولا يجب أن تواجه هذا وحدك."],
["Stay with the student and listen calmly. Do not leave them alone.","Restez avec l'étudiant et écoutez calmement. Ne le laissez pas seul.","ابقَ مع الطالب واستمع بهدوء. لا تتركه وحده."],["Tell the school counsellor straight away.","Prévenez immédiatement le conseiller de l'école.","أخبر مرشد المدرسة فوراً."],["Follow the school safeguarding protocol, including contact with guardians as it directs.","Suivez le protocole de protection de l'école, y compris le contact avec les tuteurs comme il l'indique.","اتبع بروتوكول حماية الطلاب في المدرسة بما في ذلك التواصل مع الأولياء كما يوجّه."],["Write down what was said and when, and add it to the case notes.","Notez ce qui a été dit et quand, et ajoutez-le au dossier.","دوّن ما قيل ومتى وأضفه إلى ملاحظات الحالة."],
["Promising secrecy, minimizing what was said, or debating whether it is serious.","Promettre le secret, minimiser ce qui a été dit ou débattre de sa gravité.","وعد بالسرية أو التقليل مما قيل أو مناقشة مدى جدّيته."],

["Bullying or exclusion","Harcèlement ou exclusion","التنمر أو الإقصاء"],["Reports of being targeted, a drop in connection, avoiding break time or certain classmates.","Signalements d'être ciblé(e), baisse des liens sociaux, évitement des pauses ou de certains camarades.","إبلاغ عن الاستهداف أو تراجع التواصل أو تجنب الاستراحات أو بعض الزملاء."],
["I am sorry this is happening. It is not your fault. Can you tell me where and when it happens most?","Je suis désolé(e) que cela arrive. Ce n'est pas votre faute. Pouvez-vous me dire où et quand cela arrive le plus ?","يؤسفني أن هذا يحدث. ليس ذلك خطأك. هل يمكنك إخباري أين ومتى يحدث ذلك أكثر؟"],
["Meet the student privately and take notes of places, times and people.","Rencontrez l'étudiant en privé et notez les lieux, les moments et les personnes.","قابل الطالب على انفراد ودوّن الأماكن والأوقات والأشخاص."],["Do not confront the accused in front of the class.","Ne confrontez pas la personne mise en cause devant la classe.","لا تواجه المتهم أمام الفصل."],["Plan a safe adult and a safe place for the student at break.","Prévoyez un adulte et un lieu sûrs pour l'étudiant pendant la pause.","خطط لشخص بالغ آمن ومكان آمن للطالب أثناء الاستراحة."],["Check in again within three days.","Reprenez contact dans les trois jours.","تابع مجدداً خلال ثلاثة أيام."],
["Asking the students to sort it out face to face, or telling the student to ignore it.","Demander aux étudiants de régler cela face à face, ou dire à l'étudiant de l'ignorer.","مطالبة الطلاب بحلها وجهاً لوجه أو إخبار الطالب بتجاهلها."],
["Tiredness, withdrawal, missing materials, or a student saying home is hard.","Fatigue, repli sur soi, matériel manquant, ou un étudiant disant que la maison est difficile.","تعب أو انسحاب أو نقص أدوات أو قول الطالب إن البيت صعب."],
["I can hear that things are heavy right now. You do not have to share details. I am here if you want to.","J'entends que les choses sont lourdes en ce moment. Vous n'avez pas à donner de détails. Je suis là si vous voulez.","أسمع أن الأمور ثقيلة الآن. لا يلزمك مشاركة التفاصيل. أنا هنا إن أردت."],
["Offer a quiet private conversation, not in front of others.","Proposez une conversation privée et calme, pas devant les autres.","اعرض محادثة هادئة خاصة وليس أمام الآخرين."],["Involve the school counsellor or social worker.","Impliquez le conseiller de l'école ou l'assistant social.","أشرك مرشد المدرسة أو الأخصائي الاجتماعي."],["Adjust deadlines temporarily where possible.","Ajustez temporairement les échéances si possible.","عدّل المواعيد النهائية مؤقتاً إن أمكن."],["Follow protocol if there is any sign of harm.","Suivez le protocole s'il y a le moindre signe de danger.","اتبع البروتوكول إذا ظهر أي مؤشر على ضرر."],
["Pressing for details, or contacting the family without agreeing the approach first.","Insister pour avoir des détails, ou contacter la famille sans avoir convenu de l'approche au préalable.","الإلحاح لمعرفة التفاصيل أو الاتصال بالأسرة دون الاتفاق على الأسلوب أولاً."],
["Physical health concern","Problème de santé physique","مشكلة صحية جسدية"],["Pain, frequent absences, low energy, or a student mentioning feeling unwell.","Douleur, absences fréquentes, manque d'énergie, ou un étudiant disant ne pas se sentir bien.","ألم أو غياب متكرر أو طاقة منخفضة أو ذكر الطالب أنه ليس على ما يرام."],
["Thank you for telling me. Have you been able to see the nurse or a doctor about it?","Merci de me le dire. Avez-vous pu voir l'infirmier(ère) ou un médecin à ce sujet ?","شكراً لإخباري. هل استطعت زيارة الممرض أو الطبيب بشأن ذلك؟"],
["Refer to the school nurse or health contact.","Orientez vers l'infirmier(ère) de l'école ou le référent santé.","أحِله إلى ممرض المدرسة أو جهة الاتصال الصحية."],["Allow rest breaks and flexible participation in sport.","Autorisez des pauses de repos et une participation souple au sport.","اسمح باستراحات وبمشاركة مرنة في الرياضة."],["Check the Requests tab for a medical request from this student.","Consultez l'onglet Demandes pour une demande médicale de cet étudiant.","راجع قسم الطلبات بحثاً عن طلب طبي من هذا الطالب."],
["Doubting the student or sharing medical details widely.","Douter de l'étudiant ou partager largement des détails médicaux.","التشكيك في الطالب أو نشر التفاصيل الطبية على نطاق واسع."],
["Positive low-mood screener","Dépistage d'humeur basse positif","استبيان مزاج منخفض إيجابي"],["The student scored in a range that health professionals recommend looking at on the PHQ-9.","L'étudiant a obtenu un score que les professionnels de santé recommandent d'examiner sur le PHQ-9.","حصل الطالب على درجة في نطاق يوصي المختصون الصحيون بفحصه في PHQ-9."],
["I saw that things may be hard at the moment. I would like to help you find someone to talk to.","J'ai vu que les choses sont peut-être difficiles en ce moment. J'aimerais vous aider à trouver quelqu'un à qui parler.","لاحظت أن الأمور قد تكون صعبة حالياً. أود مساعدتك في إيجاد شخص تتحدث إليه."],
["Meet privately and listen. Do not try to diagnose.","Rencontrez-le en privé et écoutez. N'essayez pas de diagnostiquer.","قابله على انفراد واستمع. لا تحاول التشخيص."],["Refer to the school counsellor or a health professional for a full assessment.","Orientez vers le conseiller de l'école ou un professionnel de santé pour une évaluation complète.","أحِله إلى مرشد المدرسة أو مختص صحي لتقييم كامل."],["Check in again within a week.","Reprenez contact dans la semaine.","تابع مجدداً خلال أسبوع."],
["Telling the student what they have, or sharing the result with classmates.","Dire à l'étudiant ce qu'il a, ou partager le résultat avec les camarades.","إخبار الطالب بما لديه أو مشاركة النتيجة مع الزملاء."],
["Positive anxiety screener","Dépistage d'anxiété positif","استبيان قلق إيجابي"],["The student scored in a range that health professionals recommend looking at on the GAD-7.","L'étudiant a obtenu un score que les professionnels de santé recommandent d'examiner sur le GAD-7.","حصل الطالب على درجة في نطاق يوصي المختصون الصحيون بفحصه في GAD-7."],
["It sounds like worry has been taking up a lot of space lately. What is it about?","On dirait que l'inquiétude prend beaucoup de place ces derniers temps. De quoi s'agit-il ?","يبدو أن القلق يشغل مساحة كبيرة مؤخراً. ما الذي يتعلق به؟"],
["Meet privately and listen. Do not try to diagnose.","Rencontrez-le en privé et écoutez. N'essayez pas de diagnostiquer.","قابله على انفراد واستمع. لا تحاول التشخيص."],["Teach a short breathing exercise and agree one small next step.","Enseignez un court exercice de respiration et convenez d'une petite prochaine étape.","علّمه تمرين تنفس قصيراً واتفقا على خطوة صغيرة تالية."],["Refer to the school counsellor for a full assessment.","Orientez vers le conseiller de l'école pour une évaluation complète.","أحِله إلى مرشد المدرسة لتقييم كامل."],
["Saying \"do not worry\" or adding pressure.","Dire « ne vous inquiétez pas » ou ajouter de la pression.","قول \"لا تقلق\" أو إضافة ضغط."],
["Attention difficulties (ASRS screener)","Difficultés d'attention (questionnaire ASRS)","صعوبات الانتباه (استبيان ASRS)"],["Four or more of the six ASRS screener items were positive. This is a screening result, not a diagnosis.","Quatre des six items du dépistage ASRS ou plus étaient positifs. C'est un résultat de dépistage, pas un diagnostic.","كانت أربعة بنود أو أكثر من بنود ASRS الستة إيجابية. هذه نتيجة فحص أولي وليست تشخيصاً."],
["I noticed that focusing and organizing work has been hard lately. Let us find what helps you.","J'ai remarqué que se concentrer et organiser son travail est difficile ces derniers temps. Cherchons ce qui vous aide.","لاحظت أن التركيز وتنظيم العمل كان صعباً مؤخراً. لنجد ما يساعدك."],
["Meet privately and avoid labels.","Rencontrez-le en privé et évitez les étiquettes.","قابله على انفراد وتجنب الألقاب."],["Offer practical supports: written instructions, tasks in small steps, a seat away from distractions.","Proposez des aides pratiques : consignes écrites, tâches en petites étapes, une place loin des distractions.","اعرض دعماً عملياً: تعليمات مكتوبة ومهام بخطوات صغيرة ومقعداً بعيداً عن المشتتات."],["Suggest an evaluation by a doctor or psychologist, because poor sleep, anxiety and low mood can look similar.","Suggérez une évaluation par un médecin ou un psychologue, car le mauvais sommeil, l'anxiété et l'humeur basse peuvent se ressembler.","اقترح تقييماً من طبيب أو أخصائي نفسي لأن قلة النوم والقلق والمزاج المنخفض قد تتشابه."],["Coordinate with the other teachers so support is consistent.","Coordonnez-vous avec les autres professeurs pour que le soutien soit cohérent.","نسّق مع بقية الأساتذة ليكون الدعم متسقاً."],
["Calling the student lazy, or telling them they have ADHD.","Traiter l'étudiant de paresseux, ou lui dire qu'il a un TDAH.","وصف الطالب بالكسل أو إخباره بأنه مصاب باضطراب فرط الحركة."],
["Repeated low mood scores, less energy, less participation, flat expression.","Scores d'humeur basse répétés, moins d'énergie, moins de participation, expression neutre.","درجات مزاج منخفضة متكررة وطاقة أقل ومشاركة أقل وتعبير خامل."],
["I have noticed you seem tired lately. How are you really doing?","J'ai remarqué que vous semblez fatigué(e) ces derniers temps. Comment allez-vous vraiment ?","لاحظت أنك تبدو متعباً مؤخراً. كيف حالك فعلاً؟"],
["Have a short private check-in and ask open questions.","Faites un court point en privé et posez des questions ouvertes.","أجرِ محادثة قصيرة خاصة واطرح أسئلة مفتوحة."],["Break tasks into small steps and recognise effort.","Découpez les tâches en petites étapes et reconnaissez les efforts.","قسّم المهام إلى خطوات صغيرة وقدّر الجهد."],["Refer to the counsellor if low mood lasts more than two weeks.","Orientez vers le conseiller si l'humeur basse dure plus de deux semaines.","أحِله إلى المرشد إذا استمر المزاج المنخفض أكثر من أسبوعين."],["Re-check the student's scores after one week.","Revérifiez les scores de l'étudiant après une semaine.","أعد فحص نتائج الطالب بعد أسبوع."],
["Saying \"cheer up\", comparing with others, or leaving it until it gets worse.","Dire « courage », comparer avec les autres, ou attendre que cela empire.","قول \"ارفع معنوياتك\" أو المقارنة بالآخرين أو الانتظار حتى يزداد الأمر سوءاً."],
["Sharp decline in wellbeing","Forte baisse du bien-être","تراجع حاد في الرفاهية"],["The latest score dropped clearly compared with the earlier check-ins.","Le dernier score a nettement baissé par rapport aux bilans précédents.","انخفضت آخر نتيجة بوضوح مقارنة بالتقييمات السابقة."],
["Something seems different from a few weeks ago. Has anything changed that I should know about?","Quelque chose semble différent d'il y a quelques semaines. Y a-t-il eu un changement que je devrais connaître ?","يبدو شيء ما مختلفاً عن قبل أسابيع. هل تغيّر شيء ينبغي أن أعرفه؟"],
["Look for what changed: a test, a conflict, an event at home, a friendship.","Cherchez ce qui a changé : un contrôle, un conflit, un événement à la maison, une amitié.","ابحث عمّا تغيّر: اختبار أو خلاف أو حدث في البيت أو صداقة."],["Speak with the student privately within a few days.","Parlez à l'étudiant en privé dans les jours qui viennent.","تحدث مع الطالب على انفراد خلال أيام."],["Tell the other teachers who need to know so support is consistent.","Informez les autres professeurs concernés pour que le soutien soit cohérent.","أخبر الأساتذة الآخرين الذين يحتاجون إلى المعرفة ليكون الدعم متسقاً."],
["Assuming it is laziness or a phase.","Supposer que c'est de la paresse ou une phase.","افتراض أنه كسل أو مرحلة عابرة."],
["Isolation","Isolement","العزلة"],["Low connection scores, eating alone, avoiding group work.","Scores de lien social bas, repas pris seul, évitement du travail de groupe.","درجات تواصل منخفضة وتناول الطعام وحيداً وتجنب العمل الجماعي."],
["I would like to help you feel more part of the class. What would make it easier?","J'aimerais vous aider à vous sentir plus intégré(e) à la classe. Qu'est-ce qui faciliterait les choses ?","أود مساعدتك على الشعور بأنك جزء من الفصل أكثر. ما الذي سيجعل الأمر أسهل؟"],
["Plan a small, structured group task with kind classmates.","Prévoyez une petite tâche de groupe structurée avec des camarades bienveillants.","خطط لمهمة جماعية صغيرة منظمة مع زملاء لطفاء."],["Give the student a clear role in class activities.","Donnez à l'étudiant un rôle clair dans les activités de classe.","امنح الطالب دوراً واضحاً في أنشطة الفصل."],["Suggest a club or activity linked to their interests.","Suggérez un club ou une activité liée à ses intérêts.","اقترح نادياً أو نشاطاً مرتبطاً باهتماماته."],
["Forcing the student to speak in front of the class.","Forcer l'étudiant à parler devant la classe.","إجبار الطالب على الكلام أمام الفصل."],
["Poor sleep scores, tiredness in the morning, difficulty concentrating.","Scores de sommeil bas, fatigue le matin, difficulté à se concentrer.","درجات نوم منخفضة وتعب صباحي وصعوبة في التركيز."],
["Sleep matters a lot for learning. What does your evening usually look like?","Le sommeil compte beaucoup pour apprendre. À quoi ressemble habituellement votre soirée ?","النوم مهم جداً للتعلم. كيف تبدو أمسيتك عادةً؟"],
["Share simple routine tips: fixed bedtime, no phone for the last hour.","Partagez des conseils simples de routine : heure de coucher fixe, pas de téléphone la dernière heure.","شارك نصائح روتين بسيطة: وقت نوم ثابت وعدم استخدام الهاتف في الساعة الأخيرة."],["Ask whether worry or noise at home is the cause.","Demandez si l'inquiétude ou le bruit à la maison en est la cause.","اسأل هل القلق أو الضجيج في البيت هو السبب."],["Check again after a week and refer if it continues.","Revérifiez après une semaine et orientez si cela continue.","تحقق مجدداً بعد أسبوع وأحِله إذا استمر الأمر."],
["Punishing lateness or sleeping in class without asking why.","Punir les retards ou le sommeil en classe sans demander pourquoi.","معاقبة التأخر أو النوم في الفصل دون السؤال عن السبب."],
["High stress scores, especially close to exams.","Scores de stress élevés, surtout près des examens.","درجات توتر مرتفعة خاصة قرب الامتحانات."],
["That is a lot to carry. Let us pick the one thing to focus on first.","C'est beaucoup à porter. Choisissons la première chose sur laquelle nous concentrer.","هذا كثير لتتحمله. لنختر الشيء الأول الذي نركز عليه."],
["Help plan a realistic revision schedule with breaks.","Aidez à planifier un programme de révision réaliste avec des pauses.","ساعد في وضع جدول مراجعة واقعي مع استراحات."],["Teach a two-minute breathing exercise.","Enseignez un exercice de respiration de deux minutes.","علّمه تمرين تنفس لمدة دقيقتين."],["Spread assessment deadlines where possible.","Étalez les échéances d'évaluation si possible.","وزّع مواعيد التقييم قدر الإمكان."],
["Adding extra pressure or comparing with top students.","Ajouter de la pression ou comparer avec les meilleurs étudiants.","إضافة ضغط أو المقارنة بالطلاب المتفوقين."],
["Overloaded by schoolwork","Surchargé(e) par le travail scolaire","مثقل بالواجبات الدراسية"],["Workload scores near the top, missed deadlines.","Scores de charge de travail proches du maximum, échéances manquées.","درجات عبء العمل قرب الحد الأعلى ومواعيد فائتة."],
["Let us look at what is due and decide what is most important together.","Regardons ce qui est à rendre et décidons ensemble de ce qui est le plus important.","لننظر فيما هو مطلوب ونقرر معاً الأهم."],
["Coordinate with other teachers to avoid several deadlines in the same week.","Coordonnez-vous avec les autres professeurs pour éviter plusieurs échéances la même semaine.","نسّق مع الأساتذة الآخرين لتجنب عدة مواعيد في الأسبوع نفسه."],["Offer a short extension for one task.","Proposez un court délai supplémentaire pour une tâche.","اعرض تمديداً قصيراً لمهمة واحدة."],["Show the student how to split work into small steps.","Montrez à l'étudiant comment découper le travail en petites étapes.","أرِ الطالب كيف يقسم العمل إلى خطوات صغيرة."],
["Piling on extra homework as a consequence.","Ajouter des devoirs supplémentaires comme conséquence.","تكديس واجبات إضافية كعقوبة."],
["Asked to talk to someone","A demandé à parler à quelqu'un","طلب التحدث مع شخص ما"],["The student ticked that they would like to talk to someone.","L'étudiant a coché qu'il aimerait parler à quelqu'un.","حدد الطالب أنه يود التحدث مع شخص ما."],
["I saw you wanted to talk. I am glad you reached out. When is a good time?","J'ai vu que vous vouliez parler. Je suis content(e) que vous ayez fait le premier pas. Quand serait un bon moment ?","رأيت أنك تريد التحدث. يسعدني أنك تواصلت. متى يكون الوقت مناسباً؟"],
["Meet the student within two school days, privately.","Rencontrez l'étudiant en privé dans un délai de deux jours d'école.","قابل الطالب على انفراد خلال يومي دراسة."],["Listen first, then agree on a next step together.","Écoutez d'abord, puis convenez ensemble d'une prochaine étape.","استمع أولاً ثم اتفقا معاً على خطوة تالية."],["Refer to the counsellor if the issue is beyond your role.","Orientez vers le conseiller si le problème dépasse votre rôle.","أحِله إلى المرشد إذا كانت المشكلة تتجاوز دورك."],
["Ignoring the request or making the student ask twice.","Ignorer la demande ou faire demander l'étudiant deux fois.","تجاهل الطلب أو جعل الطالب يطلب مرتين."],
["Search by name","Rechercher par nom","ابحث بالاسم"],["Class","Classe","الفصل"],["Level","Niveau","المستوى"],["All classes","Toutes les classes","كل الفصول"],["All levels","Tous les niveaux","كل المستويات"],["No students match","Aucun étudiant ne correspond","لا يوجد طلاب مطابقون"],["Change the search or the filters.","Modifiez la recherche ou les filtres.","غيّر البحث أو المرشحات."],["No class","Sans classe","بلا فصل"],["no check-in yet","aucun bilan pour le moment","لا تقييم بعد"],["See the director","Voir le directeur","راجع المدير"],
["Students who turned on sharing. Open a student for ideas on what to say and do in class. Sensitive details stay with the director.","Étudiants ayant activé le partage. Ouvrez un étudiant pour des idées sur quoi dire et faire en classe. Les détails sensibles restent chez le directeur.","الطلاب الذين فعّلوا المشاركة. افتح طالباً لتجد أفكاراً عمّا تقوله وتفعله في الفصل. التفاصيل الحساسة تبقى لدى المدير."],
["Only students who turned on sharing appear here. Open a student to see their recent weather and what to say and do.","Seuls les étudiants ayant activé le partage apparaissent ici. Ouvrez un étudiant pour voir sa météo récente et quoi dire et faire.","يظهر هنا فقط الطلاب الذين فعّلوا المشاركة. افتح طالباً لترى طقسه الأخير وماذا تقول وتفعل."],
["Recent check-ins","Bilans récents","أحدث التقييمات"],["No check-ins shared yet.","Aucun bilan partagé pour le moment.","لا تقييمات مشاركة بعد."],
["Please speak to the director","Veuillez en parler au directeur","يرجى التحدث إلى المدير"],["There is more information about this student that is shared only with the director and the counsellor. Do not ask the student about it. Pass your own concerns on.","Il existe d'autres informations sur cet étudiant, partagées uniquement avec le directeur et le conseiller. Ne l'interrogez pas à ce sujet. Transmettez vos propres préoccupations.","هناك معلومات أخرى عن هذا الطالب تُشارك فقط مع المدير والمرشد. لا تسأل الطالب عنها. انقل مخاوفك أنت."],
["Self-reported answers shared by the student. They are not a diagnosis. Treat them as private.","Réponses auto-déclarées partagées par l'étudiant. Ce ne sont pas des diagnostics. Traitez-les comme confidentielles.","إجابات ذاتية شاركها الطالب. ليست تشخيصاً. تعامل معها كمعلومات خاصة."],
["What you can say and do","Ce que vous pouvez dire et faire","ما يمكنك قوله وفعله"],["What to say and do","Quoi dire et faire","ماذا تقول وماذا تفعل"],["answered the self-harm question","a répondu à la question sur l'automutilation","أجاب عن سؤال إيذاء النفس"],

["Requests appear here when a student presses send in the Medical request tab.","Les demandes apparaissent ici lorsqu'un étudiant appuie sur envoyer dans l'onglet Demande médicale.","تظهر الطلبات هنا عندما يضغط طالب على إرسال في قسم الطلب الطبي."],
["Nothing waiting.","Rien en attente.","لا شيء بالانتظار."],["Has a medical certificate.","A un certificat médical.","لديه شهادة طبية."],["No certificate yet.","Pas encore de certificat.","لا توجد شهادة بعد."],["Your reply","Votre réponse","ردك"],
["Reply to the student","Répondre à l'étudiant","الرد على الطالب"],["Reply to the student (more info)","Répondre à l'étudiant (plus d'infos)","الرد على الطالب (مزيد من المعلومات)"],

["need Contributor access.","ont besoin d'un accès Contributeur.","يحتاجون إلى صلاحية مساهم."],["They see only their own data.","Ils ne voient que leurs propres données.","لا يرون إلا بياناتهم الخاصة."],
["need Editor access.","ont besoin d'un accès Éditeur.","يحتاجون إلى صلاحية محرر."],["The professor area hides sensitive details, but the page itself cannot tell a professor from a director, so give Editor access only to staff you trust.","L'espace professeur masque les détails sensibles, mais la page elle-même ne distingue pas un professeur d'un directeur ; accordez donc l'accès Éditeur uniquement au personnel de confiance.","يخفي فضاء الأستاذ التفاصيل الحساسة، لكن الصفحة نفسها لا تفرق بين أستاذ ومدير، لذا امنح صلاحية المحرر فقط لموظفين تثق بهم."],
["Anyone else sees the landing page and nothing more.","Toute autre personne voit la page d'accueil et rien de plus.","يرى أي شخص آخر صفحة الترحيب فقط."],
["Set this in the Share menu of the page. Giving someone Editor access also lets them change the page itself, so give it only to trusted staff.","Réglez cela dans le menu Partager de la page. Donner l'accès Éditeur permet aussi de modifier la page elle-même ; ne le donnez qu'au personnel de confiance.","اضبط ذلك من قائمة المشاركة في الصفحة. منح صلاحية المحرر يتيح أيضاً تغيير الصفحة نفسها، لذا امنحها فقط لموظفين موثوقين."],
["What students share","Ce que les étudiants partagent","ما يشاركه الطلاب"],["Only after they turn it on: name, school, year, class, check-in scores and flags, screener scores.","Seulement après activation : nom, école, année, classe, scores et signalements de bilan, scores de dépistage.","فقط بعد تفعيلهم لذلك: الاسم والمدرسة والسنة والفصل ونتائج التقييم وإشاراته ونتائج الاستبيانات."],["Only when they press send: a medical request and their name.","Seulement lorsqu'ils appuient sur envoyer : une demande médicale et leur nom.","فقط عند الضغط على إرسال: طلب طبي واسمهم."],["Never free text from check-ins or screener answers.","Jamais de texte libre des bilans ni de réponses aux questionnaires.","لا نصوص حرة من التقييمات ولا إجابات الاستبيانات أبداً."],
["Student information is sensitive. Share it only with people who need it to help, and keep notes in your school's own safeguarding system. StuWell is not watched in real time, so it must never be the only way a student can reach help.","Les informations sur les étudiants sont sensibles. Ne les partagez qu'avec les personnes qui en ont besoin pour aider, et conservez les notes dans le système de protection propre à votre école. StuWell n'est pas surveillé en temps réel ; il ne doit donc jamais être le seul moyen pour un étudiant d'obtenir de l'aide.","معلومات الطلاب حساسة. شاركها فقط مع من يحتاجها للمساعدة واحتفظ بالملاحظات في نظام حماية الطلاب الخاص بمدرستك. لا تتم مراقبة StuWell في الوقت الفعلي، لذا يجب ألا يكون الوسيلة الوحيدة التي يصل بها الطالب إلى المساعدة."],
["How each class is doing as a group. Only students who chose to share are counted.","Comment va chaque classe en tant que groupe. Seuls les étudiants ayant choisi de partager sont comptés.","كيف حال كل فصل كمجموعة. يُحتسب فقط الطلاب الذين اختاروا المشاركة."],
["No recent check-ins","Aucun bilan récent","لا تقييمات حديثة"],["student could use a kind word or a quiet check-in.","étudiant pourrait avoir besoin d'un mot gentil ou d'un point discret.","طالب قد يحتاج إلى كلمة طيبة أو متابعة هادئة."],["students could use a kind word or a quiet check-in.","étudiants pourraient avoir besoin d'un mot gentil ou d'un point discret.","طلاب قد يحتاجون إلى كلمة طيبة أو متابعة هادئة."],["Nobody stands out right now.","Personne ne se démarque pour le moment.","لا أحد يبرز حالياً."],
["How you can help","Comment vous pouvez aider","كيف يمكنك المساعدة"],["Small things work: greet students by name, give clear deadlines, leave room for questions, and keep a quiet word for anyone who seems different. Open Students to see what to say and do for each flag.","Les petites choses fonctionnent : saluez les étudiants par leur nom, donnez des échéances claires, laissez de la place aux questions et gardez un mot discret pour quiconque semble différent. Ouvrez Étudiants pour voir quoi dire et faire pour chaque signalement.","الأشياء الصغيرة تنفع: حيِّ الطلاب بأسمائهم وحدد مواعيد واضحة واترك مجالاً للأسئلة وخصص كلمة هادئة لمن يبدو مختلفاً. افتح الطلاب لترى ماذا تقول وتفعل لكل إشارة."],

["Preview mode: no student data is shown. Open StuWell through your school's link to see real students.","Mode aperçu : aucune donnée d'étudiant n'est affichée. Ouvrez StuWell via le lien de votre école pour voir les vrais étudiants.","وضع المعاينة: لا تظهر أي بيانات للطلاب. افتح StuWell عبر رابط مدرستك لرؤية الطلاب الحقيقيين."],

["Five questions from the World Health Organization about your general well-being.","Cinq questions de l'Organisation mondiale de la santé sur votre bien-être général.","خمسة أسئلة من منظمة الصحة العالمية حول رفاهيتك العامة."],
["Ten questions that researchers worldwide use to measure how stressful your life has felt.","Dix questions utilisées par les chercheurs du monde entier pour mesurer à quel point votre vie vous a semblé stressante.","عشرة أسئلة يستخدمها الباحثون حول العالم لقياس مدى شعورك بأن حياتك مرهقة."],
["Please choose the answer that is closest to how you have been feeling over the last 2 weeks.","Choisissez la réponse la plus proche de ce que vous avez ressenti au cours des 2 dernières semaines.","اختر الإجابة الأقرب إلى ما شعرت به خلال الأسبوعين الماضيين."],

["Your answers suggest good well-being","Vos réponses suggèrent un bon niveau de bien-être","تشير إجاباتك إلى مستوى جيد من الرفاهية"],
["Over the last 2 weeks you reported feeling well most of the time. Keep the routines and people that help you feel this way.","Au cours des 2 dernières semaines, vous avez indiqué vous sentir bien la plupart du temps. Gardez les habitudes et les personnes qui vous aident à vous sentir ainsi.","خلال الأسبوعين الماضيين أبلغتَ أنك شعرت بأنك بخير معظم الوقت. حافظ على العادات والأشخاص الذين يساعدونك على الشعور بذلك."],
["Your answers suggest low well-being","Vos réponses suggèrent un bien-être bas","تشير إجاباتك إلى مستوى منخفض من الرفاهية"],
["Your well-being over the last 2 weeks seems lower than usual. This is often linked to stress or low mood. The Mood check (PHQ-9) can help you see more clearly, and talking to someone is a good idea.","Votre bien-être au cours des 2 dernières semaines semble plus bas que d'habitude. C'est souvent lié au stress ou à une humeur basse. Le bilan d'humeur (PHQ-9) peut vous aider à y voir plus clair, et en parler à quelqu'un est une bonne idée.","يبدو أن رفاهيتك خلال الأسبوعين الماضيين أقل من المعتاد. غالباً ما يرتبط ذلك بالتوتر أو المزاج المنخفض. يمكن لفحص المزاج (PHQ-9) أن يساعدك على الرؤية بوضوح أكبر، والتحدث مع شخص ما فكرة جيدة."],
["Your answers suggest very low well-being","Vos réponses suggèrent un bien-être très bas","تشير إجاباتك إلى مستوى منخفض جداً من الرفاهية"],
["Your well-being over the last 2 weeks seems very low. This is a good reason to talk to a psychologist, a doctor or your university's health service. Only a professional can say what is going on.","Votre bien-être au cours des 2 dernières semaines semble très bas. C'est une bonne raison de parler à un psychologue, à un médecin ou au service de santé de votre université. Seul un professionnel peut dire ce qui se passe.","يبدو أن رفاهيتك خلال الأسبوعين الماضيين منخفضة جداً. هذا سبب وجيه للتحدث مع أخصائي نفسي أو طبيب أو مع الخدمة الصحية في جامعتك. وحده المختص يستطيع أن يحدد ما يجري."],
["How often have you been upset because of something that happened unexpectedly?","À quelle fréquence avez-vous été dérangé(e) par un événement inattendu ?","كم مرة انزعجت بسبب شيء حدث بشكل غير متوقع؟"],

["Over the last month you reported a low level of stress. Keep the habits that help you stay balanced.","Au cours du dernier mois, vous avez signalé un niveau de stress bas. Gardez les habitudes qui vous aident à rester équilibré(e).","خلال الشهر الماضي أبلغتَ عن مستوى منخفض من التوتر. حافظ على العادات التي تساعدك على البقاء متوازناً."],
["Your answers suggest a moderate level of stress","Vos réponses suggèrent un niveau de stress modéré","تشير إجاباتك إلى مستوى متوسط من التوتر"],
["You reported a moderate level of stress, which is common for students, especially around exams. The calm tools and the steps below can help. If it lasts, talk to someone.","Vous avez signalé un niveau de stress modéré, ce qui est courant chez les étudiants, surtout autour des examens. Les outils d'apaisement et les étapes ci-dessous peuvent aider. Si cela dure, parlez-en à quelqu'un.","أبلغتَ عن مستوى متوسط من التوتر، وهذا شائع بين الطلاب خاصة قرب الامتحانات. يمكن أن تساعدك أدوات الهدوء والخطوات أدناه. إذا استمر الأمر فتحدث مع شخص ما."],
["Your answers suggest a high level of stress","Vos réponses suggèrent un niveau de stress élevé","تشير إجاباتك إلى مستوى مرتفع من التوتر"],
["Your answers suggest a high level of stress over the last month. It is a good reason to talk to a psychologist, a counsellor or your university's health service, and to look at your workload with someone.","Vos réponses suggèrent un niveau de stress élevé au cours du dernier mois. C'est une bonne raison de parler à un psychologue, à un conseiller ou au service de santé de votre université, et de revoir votre charge de travail avec quelqu'un.","تشير إجاباتك إلى مستوى مرتفع من التوتر خلال الشهر الماضي. هذا سبب وجيه للتحدث مع أخصائي نفسي أو مرشد أو مع الخدمة الصحية في جامعتك، ولمراجعة عبء عملك مع شخص ما."],
["Your answers suggest few symptoms of low mood","Vos réponses suggèrent peu de symptômes d'humeur basse","تشير إجاباتك إلى أعراض قليلة للمزاج المنخفض"],
["Over the last 2 weeks you reported few symptoms of low mood. Keep the habits that protect your mood: regular sleep, movement and time with people you like.","Au cours des 2 dernières semaines, vous avez signalé peu de symptômes d'humeur basse. Gardez les habitudes qui protègent votre humeur : un sommeil régulier, du mouvement et du temps avec des personnes que vous aimez.","خلال الأسبوعين الماضيين أبلغتَ عن أعراض قليلة للمزاج المنخفض. حافظ على العادات التي تحمي مزاجك: نوم منتظم وحركة ووقت مع من تحب."],
["Your answers suggest some symptoms of low mood","Vos réponses suggèrent quelques symptômes d'humeur basse","تشير إجاباتك إلى بعض أعراض المزاج المنخفض"],
["Your answers suggest a moderate level of low-mood symptoms","Vos réponses suggèrent un niveau modéré de symptômes d'humeur basse","تشير إجاباتك إلى مستوى متوسط من أعراض المزاج المنخفض"],
["Your answers suggest a high level of low-mood symptoms","Vos réponses suggèrent un niveau élevé de symptômes d'humeur basse","تشير إجاباتك إلى مستوى مرتفع من أعراض المزاج المنخفض"],
["Your answers suggest a high level of low-mood symptoms. Only a professional can say what is going on, so please talk to a psychologist, a doctor or your university's health service soon. Support works, and you do not have to manage this alone.","Vos réponses suggèrent un niveau élevé de symptômes d'humeur basse. Seul un professionnel peut dire ce qui se passe : parlez bientôt à un psychologue, à un médecin ou au service de santé de votre université. L'accompagnement fonctionne et vous n'avez pas à gérer cela seul(e).","تشير إجاباتك إلى مستوى مرتفع من أعراض المزاج المنخفض. وحده المختص يستطيع أن يحدد ما يجري، لذا تحدث قريباً مع أخصائي نفسي أو طبيب أو مع الخدمة الصحية في جامعتك. الدعم ينجح ولا يجب أن تواجه ذلك وحدك."],
["Your answers suggest a very high level of low-mood symptoms","Vos réponses suggèrent un niveau très élevé de symptômes d'humeur basse","تشير إجاباتك إلى مستوى مرتفع جداً من أعراض المزاج المنخفض"],
["Your answers suggest a very high level of low-mood symptoms that are affecting you a lot. Please see a doctor, a psychiatrist or a psychologist this week, and tell an adult you trust.","Vos réponses suggèrent un niveau très élevé de symptômes d'humeur basse qui vous affectent beaucoup. Consultez un médecin, un psychiatre ou un psychologue cette semaine et parlez-en à un adulte de confiance.","تشير إجاباتك إلى مستوى مرتفع جداً من أعراض المزاج المنخفض تؤثر فيك كثيراً. من فضلك راجع طبيباً أو طبيباً نفسياً أو أخصائياً نفسياً هذا الأسبوع، وأخبر شخصاً بالغاً تثق به."],

["Your answers suggest a high level of anxiety symptoms that are affecting you a lot. Please speak to a psychologist or a doctor soon. Anxiety responds well to support.","Vos réponses suggèrent un niveau élevé de symptômes d'anxiété qui vous affectent beaucoup. Parlez bientôt à un psychologue ou à un médecin. L'anxiété répond bien à un accompagnement.","تشير إجاباتك إلى مستوى مرتفع من أعراض القلق تؤثر فيك كثيراً. من فضلك تحدث قريباً مع أخصائي نفسي أو طبيب. القلق يستجيب جيداً للدعم."],
["Your answers suggest few attention difficulties","Vos réponses suggèrent peu de difficultés d'attention","تشير إجاباتك إلى صعوبات قليلة في الانتباه"],
["Your answers suggest some attention and organization difficulties","Vos réponses suggèrent quelques difficultés d'attention et d'organisation","تشير إجاباتك إلى بعض صعوبات الانتباه والتنظيم"],
["Your answers suggest attention difficulties worth checking with a professional","Vos réponses suggèrent des difficultés d'attention à vérifier avec un professionnel","تشير إجاباتك إلى صعوبات في الانتباه تستحق المراجعة مع مختص"],
["Screening, not diagnosis","Dépistage, pas diagnostic","فحص أولي وليس تشخيصاً"],
["Only a doctor, a psychiatrist or a psychologist can make a diagnosis, after a proper conversation with you. StuWell does not replace a consultation and does not make any diagnosis.","Seul un médecin, un psychiatre ou un psychologue peut poser un diagnostic, après un véritable entretien avec vous. StuWell ne remplace pas une consultation et ne pose aucun diagnostic.","وحده الطبيب أو الطبيب النفسي أو الأخصائي النفسي يستطيع التشخيص بعد محادثة حقيقية معك. لا يحل StuWell محل الاستشارة ولا يقدم أي تشخيص."],
["Take this result to a psychologist, a doctor or your university's health service. They can look at the whole picture, including how long it has lasted.","Apportez ce résultat à un psychologue, à un médecin ou au service de santé de votre université. Ils pourront examiner l'ensemble de la situation, y compris depuis combien de temps cela dure.","خذ هذه النتيجة إلى أخصائي نفسي أو طبيب أو إلى الخدمة الصحية في جامعتك. يمكنهم النظر إلى الصورة كاملة، بما في ذلك مدة استمرار الأمر."],
["See who can help","Voir qui peut aider","اعرف من يمكنه المساعدة"],["Take the mood check","Faire le bilan d'humeur","إجراء فحص المزاج"],
["Who can help you","Qui peut vous aider","من يمكنه مساعدتك"],
["StuWell helps you notice when something is wrong and points you to the right person. These are the professionals who can really help.","StuWell vous aide à repérer quand quelque chose ne va pas et vous oriente vers la bonne personne. Voici les professionnels qui peuvent vraiment vous aider.","يساعدك StuWell على ملاحظة أن شيئاً ما ليس على ما يرام ويوجهك إلى الشخص المناسب. هؤلاء هم المختصون الذين يمكنهم مساعدتك فعلاً."],
["A psychologist","Un psychologue","أخصائي نفسي"],["Listens, helps you understand what you feel and offers talking therapy. A good first step for stress, anxiety or low mood.","Écoute, vous aide à comprendre ce que vous ressentez et propose une thérapie par la parole. Un bon premier pas pour le stress, l'anxiété ou l'humeur basse.","يستمع إليك ويساعدك على فهم ما تشعر به ويقدم العلاج بالحديث. خطوة أولى جيدة للتوتر أو القلق أو المزاج المنخفض."],
["A psychiatrist","Un psychiatre","طبيب نفسي"],["A medical doctor who specializes in mental health. Can make a diagnosis and prescribe treatment if needed.","Un médecin spécialisé en santé mentale. Il peut poser un diagnostic et prescrire un traitement si nécessaire.","طبيب متخصص في الصحة النفسية. يستطيع التشخيص ووصف العلاج عند الحاجة."],
["A general practitioner","Un médecin généraliste","طبيب عام"],["Your usual doctor. Can check your physical health, look for other causes and refer you to a specialist.","Votre médecin habituel. Il peut vérifier votre santé physique, rechercher d'autres causes et vous orienter vers un spécialiste.","طبيبك المعتاد. يستطيع فحص صحتك الجسدية والبحث عن أسباب أخرى وتحويلك إلى مختص."],
["Your university's health service","Le service de santé de votre université","الخدمة الصحية في جامعتك"],["Many schools and universities have a nurse, a counsellor or a psychologist that students can see for free. Ask at the administration office.","Beaucoup d'écoles et d'universités ont un(e) infirmier(ère), un conseiller ou un psychologue que les étudiants peuvent voir gratuitement. Renseignez-vous auprès de l'administration.","لدى كثير من المدارس والجامعات ممرض أو مرشد أو أخصائي نفسي يمكن للطلاب مقابلته مجاناً. اسأل في مكتب الإدارة."],
["How long have you been feeling like this?","Depuis combien de temps vous sentez-vous ainsi ?","منذ متى تشعر بهذا؟"],["Only today","Seulement aujourd'hui","اليوم فقط"],["A few days","Quelques jours","بضعة أيام"],["About two weeks","Environ deux semaines","حوالي أسبوعين"],["More than two weeks","Plus de deux semaines","أكثر من أسبوعين"],
["This has lasted a while","Cela dure depuis un moment","هذا مستمر منذ فترة"],
["You said you have felt this way for about two weeks or more. When difficult feelings last this long, it is worth checking with a professional. The Mood check and the Stress check can help you see more clearly first.","Vous avez dit vous sentir ainsi depuis environ deux semaines ou plus. Quand des sentiments difficiles durent aussi longtemps, il vaut la peine d'en parler à un professionnel. Le bilan d'humeur et le bilan de stress peuvent d'abord vous aider à y voir plus clair.","قلتَ إنك تشعر بهذا منذ حوالي أسبوعين أو أكثر. عندما تستمر المشاعر الصعبة كل هذه المدة فمن المفيد مراجعة مختص. يمكن لفحص المزاج وفحص التوتر أن يساعداك أولاً على الرؤية بوضوح أكبر."],
["Validated questionnaires, never a diagnosis","Questionnaires validés, jamais de diagnostic","استبيانات معتمدة، دون أي تشخيص"],["validated screeners, not diagnoses","questionnaires validés, pas des diagnostics","استبيانات معتمدة وليست تشخيصات"],
["Mood, anxiety, stress, attention","Humeur, anxiété, stress, attention","المزاج، القلق، التوتر، الانتباه"],
["Validated questionnaires that show whether it is worth talking to a professional. They never give a diagnosis.","Des questionnaires validés qui montrent s'il vaut la peine de parler à un professionnel. Ils ne donnent jamais de diagnostic.","استبيانات معتمدة توضح ما إذا كان من المفيد التحدث مع مختص. ولا تقدم تشخيصاً أبداً."],
["Screener: low well-being","Dépistage : bien-être bas","استبيان: رفاهية منخفضة"],["Screener: high stress","Dépistage : stress élevé","استبيان: توتر مرتفع"],
["Very low well-being screener","Dépistage de bien-être très bas","استبيان رفاهية منخفضة جداً"],["The student scored 28 or less out of 100 on the WHO-5 well-being index.","L'étudiant a obtenu 28 ou moins sur 100 à l'indice de bien-être WHO-5.","حصل الطالب على 28 أو أقل من 100 في مؤشر الرفاهية WHO-5."],

["Self-esteem check","Bilan d'estime de soi","فحص تقدير الذات"],["Distress check","Bilan de détresse","فحص الضيق النفسي"],
["Ten statements from the Rosenberg Self-Esteem Scale about how you see yourself.","Dix affirmations de l'échelle d'estime de soi de Rosenberg sur la façon dont vous vous voyez.","عشر عبارات من مقياس روزنبرغ لتقدير الذات حول نظرتك إلى نفسك."],
["Here are statements about how you feel about yourself in general. Choose how much you agree or disagree with each one.","Voici des affirmations sur ce que vous ressentez envers vous-même en général. Indiquez à quel point vous êtes d'accord ou non avec chacune.","هذه عبارات عن شعورك تجاه نفسك بشكل عام. اختر مدى موافقتك أو عدم موافقتك على كل منها."],
["Strongly agree","Tout à fait d'accord","موافق بشدة"],["Agree","D'accord","موافق"],["Disagree","Pas d'accord","غير موافق"],["Strongly disagree","Pas du tout d'accord","غير موافق بشدة"],
["On the whole, I am satisfied with myself.","Dans l'ensemble, je suis satisfait(e) de moi.","بشكل عام، أنا راضٍ عن نفسي."],
["At times I think I am no good at all.","Parfois, je pense que je ne vaux rien.","أحياناً أظن أنني لا أصلح لشيء على الإطلاق."],
["I feel that I have a number of good qualities.","Je pense que j'ai un certain nombre de qualités.","أشعر أن لدي عدداً من الصفات الجيدة."],
["I am able to do things as well as most other people.","Je suis capable de faire les choses aussi bien que la plupart des gens.","أستطيع القيام بالأشياء بنفس جودة معظم الناس."],
["I feel I do not have much to be proud of.","Je sens que je n'ai pas grand-chose dont je puisse être fier(ère).","أشعر أنه ليس لدي الكثير مما أفخر به."],
["I certainly feel useless at times.","Il m'arrive de me sentir vraiment inutile.","أشعر بالتأكيد بأنني عديم الفائدة أحياناً."],
["I feel that I'm a person of worth, at least on an equal plane with others.","Je pense que je suis une personne de valeur, au moins égale aux autres.","أشعر أنني شخص ذو قيمة، على الأقل على قدم المساواة مع الآخرين."],
["I wish I could have more respect for myself.","J'aimerais avoir plus de respect pour moi-même.","أتمنى لو كان لدي احترام أكبر لنفسي."],
["All in all, I am inclined to feel that I am a failure.","Tout bien considéré, j'ai tendance à penser que je suis un(e) raté(e).","بشكل عام، أميل إلى الشعور بأنني فاشل."],
["I take a positive attitude toward myself.","J'ai une attitude positive envers moi-même.","أتبنى موقفاً إيجابياً تجاه نفسي."],
["Not satisfied with myself","Pas satisfait(e) de moi","غير راضٍ عن نفسي"],["Feeling no good","Se sentir nul(le)","الشعور بعدم القيمة"],["Few good qualities","Peu de qualités","صفات جيدة قليلة"],["Less able than others","Moins capable que les autres","أقل قدرة من الآخرين"],["Little to be proud of","Peu de raisons d'être fier(ère)","القليل مما يُفتخر به"],["Feeling useless","Se sentir inutile","الشعور بعدم الفائدة"],["Not a person of worth","Pas une personne de valeur","لست شخصاً ذا قيمة"],["Wishing for more self-respect","Vouloir plus de respect de soi","الرغبة في احترام أكبر للذات"],["Feeling like a failure","Se sentir en échec","الشعور بالفشل"],["Negative attitude to myself","Attitude négative envers soi","موقف سلبي تجاه النفس"],
["Usual range","Plage habituelle","النطاق المعتاد"],["Healthy","Sain","سليم"],
["Your answers suggest low self-esteem","Vos réponses suggèrent une faible estime de soi","تشير إجاباتك إلى تقدير منخفض للذات"],
["Your answers suggest self-esteem in the usual range","Vos réponses suggèrent une estime de soi dans la plage habituelle","تشير إجاباتك إلى تقدير للذات ضمن النطاق المعتاد"],
["Your answers suggest high self-esteem","Vos réponses suggèrent une bonne estime de soi","تشير إجاباتك إلى تقدير مرتفع للذات"],
["Your answers suggest that you often see yourself in a harsh light. This is common, especially during stressful periods, and it can change. Talking to a psychologist or a counsellor can help, and so can the steps below.","Vos réponses suggèrent que vous vous jugez souvent durement. C'est courant, surtout pendant les périodes de stress, et cela peut changer. Parler à un psychologue ou à un conseiller peut aider, tout comme les étapes ci-dessous.","تشير إجاباتك إلى أنك كثيراً ما تنظر إلى نفسك بقسوة. هذا شائع خاصة في فترات الضغط، ويمكن أن يتغير. قد يساعدك التحدث مع أخصائي نفسي أو مرشد، وكذلك الخطوات أدناه."],
["Your answers are in the range most people score in. Everyone has days of self-doubt. Notice what helps you feel good about yourself and keep it going.","Vos réponses se situent dans la plage de la plupart des gens. Tout le monde a des jours de doute. Remarquez ce qui vous aide à vous sentir bien avec vous-même et continuez.","إجاباتك ضمن النطاق الذي يقع فيه معظم الناس. لكل شخص أيام من الشك في النفس. لاحظ ما يساعدك على الشعور بالرضا عن نفسك وواصل."],
["Your answers suggest that you see yourself in a positive way. Keep the habits and people that support you.","Vos réponses suggèrent que vous vous voyez de façon positive. Gardez les habitudes et les personnes qui vous soutiennent.","تشير إجاباتك إلى أنك تنظر إلى نفسك بإيجابية. حافظ على العادات والأشخاص الذين يدعمونك."],
["Ten questions that psychological services use to check how much distress you have felt over the last week.","Dix questions utilisées par les services de psychologie pour évaluer la détresse ressentie au cours de la dernière semaine.","عشرة أسئلة تستخدمها الخدمات النفسية لمعرفة مقدار الضيق الذي شعرت به خلال الأسبوع الماضي."],
["These statements are about how you have been over the last week. Choose how often you felt this way.","Ces affirmations portent sur la façon dont vous vous êtes senti(e) au cours de la dernière semaine. Indiquez à quelle fréquence vous avez ressenti cela.","تتعلق هذه العبارات بحالك خلال الأسبوع الماضي. اختر كم مرة شعرت بذلك."],

["I have felt I have someone to turn to for support when needed","J'ai senti que j'avais quelqu'un vers qui me tourner en cas de besoin","شعرت أن لدي من ألجأ إليه للدعم عند الحاجة"],
["I have felt able to cope when things go wrong","Je me suis senti(e) capable de faire face quand les choses vont mal","شعرت أنني قادر على التعامل مع الأمور حين تسوء"],

["I have felt panic or terror","J'ai ressenti de la panique ou de la terreur","شعرت بالذعر أو الرعب"],
["I made plans to end my life","J'ai fait des projets pour mettre fin à ma vie","وضعت خططاً لإنهاء حياتي"],
["I have had difficulty getting to sleep or staying asleep","J'ai eu du mal à m'endormir ou à rester endormi(e)","واجهت صعوبة في النوم أو في البقاء نائماً"],

["I have felt unhappy","Je me suis senti(e) malheureux(se)","شعرت بالتعاسة"],

["Tense or anxious","Tendu(e) ou anxieux(se)","متوتر أو قلق"],["No one to turn to","Personne vers qui se tourner","لا أحد ألجأ إليه"],["Hard to cope","Difficile de faire face","صعوبة في التأقلم"],["Talking feels too much","Parler semble trop difficile","الكلام يبدو مرهقاً"],["Panic or terror","Panique ou terreur","ذعر أو رعب"],["Plans to end my life","Projets de mettre fin à ma vie","خطط لإنهاء حياتي"],["Sleep problems","Problèmes de sommeil","مشاكل النوم"],["Despairing or hopeless","Désespoir","يأس أو فقدان أمل"],["Unhappy","Malheureux(se)","تعيس"],["Distressing memories","Souvenirs pénibles","ذكريات مؤلمة"],

["Your answers suggest a very high level of distress","Vos réponses suggèrent un niveau de détresse très élevé","تشير إجاباتك إلى مستوى مرتفع جداً من الضيق"],
["Over the last week you reported little distress. Keep the habits and people that help you feel steady.","Au cours de la dernière semaine, vous avez signalé peu de détresse. Gardez les habitudes et les personnes qui vous aident à rester stable.","خلال الأسبوع الماضي أبلغتَ عن ضيق قليل. حافظ على العادات والأشخاص الذين يساعدونك على الشعور بالثبات."],
["You reported some distress over the last week, within the range many people go through. The calm tools and the steps below can help.","Vous avez signalé un peu de détresse cette semaine, dans la plage que beaucoup de gens traversent. Les outils d'apaisement et les étapes ci-dessous peuvent aider.","أبلغتَ عن بعض الضيق خلال الأسبوع الماضي، ضمن النطاق الذي يمر به كثير من الناس. يمكن أن تساعدك أدوات الهدوء والخطوات أدناه."],
["Your answers are in the range where talking to someone often helps. Consider a counsellor, a psychologist or your university's health service.","Vos réponses se situent dans la plage où parler à quelqu'un aide souvent. Pensez à un conseiller, à un psychologue ou au service de santé de votre université.","إجاباتك ضمن النطاق الذي غالباً ما يساعد فيه التحدث مع شخص ما. فكّر في مرشد أو أخصائي نفسي أو الخدمة الصحية في جامعتك."],
["Your answers suggest that things have been hard over the last week. Please talk to a psychologist, a doctor or your university's health service soon. Only a professional can say what is going on.","Vos réponses suggèrent que la dernière semaine a été difficile. Parlez bientôt à un psychologue, à un médecin ou au service de santé de votre université. Seul un professionnel peut dire ce qui se passe.","تشير إجاباتك إلى أن الأسبوع الماضي كان صعباً. من فضلك تحدث قريباً مع أخصائي نفسي أو طبيب أو الخدمة الصحية في جامعتك. وحده المختص يستطيع أن يحدد ما يجري."],
["Your answers suggest a high level of distress over the last week. Please see a psychologist or a doctor this week, and tell someone you trust.","Vos réponses suggèrent un niveau de détresse élevé au cours de la dernière semaine. Consultez un psychologue ou un médecin cette semaine et parlez-en à une personne de confiance.","تشير إجاباتك إلى مستوى مرتفع من الضيق خلال الأسبوع الماضي. من فضلك راجع أخصائياً نفسياً أو طبيباً هذا الأسبوع، وأخبر شخصاً تثق به."],
["Your answers suggest a very high level of distress. Please contact a doctor or a psychologist as soon as possible, and do not stay alone with this.","Vos réponses suggèrent un niveau de détresse très élevé. Contactez un médecin ou un psychologue dès que possible et ne restez pas seul(e) avec cela.","تشير إجاباتك إلى مستوى مرتفع جداً من الضيق. من فضلك تواصل مع طبيب أو أخصائي نفسي في أقرب وقت، ولا تبقَ وحدك مع هذا."],
["You mentioned plans to end your life","Vous avez mentionné des projets de mettre fin à votre vie","ذكرتَ خططاً لإنهاء حياتك"],
["Self-esteem","Estime de soi","تقدير الذات"],["self-esteem","l'estime de soi","تقدير الذات"],["How you see yourself","Comment vous vous voyez","كيف ترى نفسك"],
["Self-esteem is how you see and value yourself. Low self-esteem is not a diagnosis, but it often comes with stress, low mood or anxiety, and it can improve.","L'estime de soi, c'est la façon dont vous vous voyez et vous valorisez. Une faible estime de soi n'est pas un diagnostic, mais elle accompagne souvent le stress, l'humeur basse ou l'anxiété, et elle peut s'améliorer.","تقدير الذات هو كيف ترى نفسك وتقدّرها. تدني تقدير الذات ليس تشخيصاً، لكنه غالباً ما يرافق التوتر أو المزاج المنخفض أو القلق، ويمكن أن يتحسن."],
["Being very hard on yourself","Être très dur(e) envers soi-même","القسوة الشديدة على النفس"],["Noticing your mistakes more than your successes","Remarquer ses erreurs plus que ses réussites","ملاحظة أخطائك أكثر من نجاحاتك"],["Feeling you are not as good as others","Se sentir moins bien que les autres","الشعور بأنك أقل من الآخرين"],["Finding it hard to accept compliments","Avoir du mal à accepter les compliments","صعوبة تقبّل المديح"],["Avoiding challenges because you fear failing","Éviter les défis par peur d'échouer","تجنب التحديات خوفاً من الفشل"],
["Write down one thing you did well each day.","Notez chaque jour une chose que vous avez bien faite.","اكتب كل يوم شيئاً واحداً أحسنت فعله."],["Talk to yourself the way you would talk to a friend.","Parlez-vous comme vous parleriez à un ami.","تحدث إلى نفسك كما تتحدث إلى صديق."],["Set small goals you can reach, and notice when you reach them.","Fixez-vous de petits objectifs atteignables et remarquez quand vous les atteignez.","ضع أهدافاً صغيرة يمكنك بلوغها، ولاحظ عندما تبلغها."],["Spend time with people who treat you with respect.","Passez du temps avec des personnes qui vous traitent avec respect.","اقضِ وقتاً مع أشخاص يعاملونك باحترام."],["Talk to a psychologist or a counsellor if it weighs on you.","Parlez à un psychologue ou à un conseiller si cela vous pèse.","تحدث مع أخصائي نفسي أو مرشد إذا كان الأمر يثقل عليك."],
["If a low opinion of yourself lasts for weeks, or comes with low mood or thoughts of hurting yourself, talk to a professional.","Si une mauvaise opinion de vous-même dure des semaines, ou s'accompagne d'une humeur basse ou de pensées de vous faire du mal, parlez à un professionnel.","إذا استمرت نظرتك السلبية لنفسك أسابيع، أو ترافقت مع مزاج منخفض أو أفكار بإيذاء نفسك، فتحدث مع مختص."],
["Feeling overwhelmed","Se sentir dépassé(e)","الشعور بالإرهاق النفسي"],["feeling overwhelmed","le sentiment d'être dépassé(e)","الشعور بالإرهاق النفسي"],["When everything feels like too much","Quand tout semble de trop","عندما يبدو كل شيء أكثر من اللازم"],
["Sometimes stress, worry, low mood and poor sleep pile up at the same time. Feeling overwhelmed is not a diagnosis. It is a sign that you need support.","Parfois, le stress, l'inquiétude, l'humeur basse et le mauvais sommeil s'accumulent en même temps. Se sentir dépassé(e) n'est pas un diagnostic. C'est un signe que vous avez besoin de soutien.","أحياناً يتراكم التوتر والقلق والمزاج المنخفض وسوء النوم في الوقت نفسه. الشعور بالإرهاق النفسي ليس تشخيصاً، بل علامة على أنك تحتاج إلى دعم."],
["Feeling tense or on edge most days","Se sentir tendu(e) ou à cran la plupart des jours","الشعور بالتوتر معظم الأيام"],["Feeling unhappy or hopeless","Se sentir malheureux(se) ou sans espoir","الشعور بالتعاسة أو اليأس"],["Finding it hard to cope with everyday things","Avoir du mal à gérer le quotidien","صعوبة التعامل مع الأمور اليومية"],["Sleeping badly","Mal dormir","النوم بشكل سيئ"],["Pulling away from people","S'éloigner des autres","الابتعاد عن الناس"],
["Pick one small thing that makes today a little easier.","Choisissez une petite chose qui rend la journée un peu plus facile.","اختر شيئاً صغيراً يجعل يومك أسهل قليلاً."],["Use a breathing or grounding exercise when it peaks.","Faites un exercice de respiration ou d'ancrage quand c'est le plus fort.","استخدم تمرين تنفس أو تأريض عندما يشتد الأمر."],["Tell someone you trust how things are.","Dites à une personne de confiance comment ça va.","أخبر شخصاً تثق به بحالك."],["Talk to a counsellor, a psychologist or your university's health service.","Parlez à un conseiller, à un psychologue ou au service de santé de votre université.","تحدث مع مرشد أو أخصائي نفسي أو الخدمة الصحية في جامعتك."],
["If it lasts more than two weeks, stops you doing everyday things, or comes with thoughts of ending your life, get help now.","Si cela dure plus de deux semaines, vous empêche de faire les choses du quotidien ou s'accompagne de pensées de mettre fin à votre vie, demandez de l'aide maintenant.","إذا استمر الأمر أكثر من أسبوعين، أو منعك من القيام بأمورك اليومية، أو ترافق مع أفكار بإنهاء حياتك، فاطلب المساعدة الآن."],
["Screener: plans to end life","Dépistage : projets de mettre fin à sa vie","استبيان: خطط لإنهاء الحياة"],["Screener: high distress","Dépistage : détresse élevée","استبيان: ضيق مرتفع"],["Screener: low self-esteem","Dépistage : faible estime de soi","استبيان: تدني تقدير الذات"],
["Screener: plans to end life (CORE-10)","Dépistage : projets de mettre fin à sa vie (CORE-10)","استبيان: خطط لإنهاء الحياة (CORE-10)"],
["The student answered the CORE-10 question \"I made plans to end my life\" above \"Not at all\".","L'étudiant a répondu à la question du CORE-10 « J'ai fait des projets pour mettre fin à ma vie » autrement que « Pas du tout ».","أجاب الطالب عن سؤال CORE-10 \"وضعت خططاً لإنهاء حياتي\" بإجابة غير \"أبداً\"."],
["High distress screener (CORE-10)","Dépistage de détresse élevée (CORE-10)","استبيان ضيق مرتفع (CORE-10)"],["The student scored 15 or more out of 40 on the CORE-10 distress measure.","L'étudiant a obtenu 15 ou plus sur 40 à la mesure de détresse CORE-10.","حصل الطالب على 15 أو أكثر من 40 في مقياس الضيق CORE-10."],
["Low self-esteem screener (RSES)","Dépistage de faible estime de soi (RSES)","استبيان تدني تقدير الذات (RSES)"],["The student scored below 15 out of 30 on the Rosenberg Self-Esteem Scale.","L'étudiant a obtenu moins de 15 sur 30 à l'échelle d'estime de soi de Rosenberg.","حصل الطالب على أقل من 15 من 30 في مقياس روزنبرغ لتقدير الذات."],
["I have noticed the effort you put in. What do you feel you are good at?","J'ai remarqué les efforts que vous faites. Dans quoi pensez-vous être bon(ne) ?","لاحظت الجهد الذي تبذله. ما الذي تشعر أنك جيد فيه؟"],
["Point out specific things the student did well.","Soulignez des choses précises que l'étudiant a bien faites.","أشر إلى أشياء محددة أحسن الطالب فعلها."],["Give tasks where the student can succeed, then build up.","Donnez des tâches où l'étudiant peut réussir, puis augmentez progressivement.","أعطِ مهام يستطيع الطالب النجاح فيها ثم تدرّج."],["Refer to the counsellor if low self-esteem comes with low mood.","Orientez vers le conseiller si la faible estime de soi s'accompagne d'une humeur basse.","أحِله إلى المرشد إذا ترافق تدني تقدير الذات مع مزاج منخفض."],
["Comparing the student with others, or criticising them in front of the class.","Comparer l'étudiant aux autres ou le critiquer devant la classe.","مقارنة الطالب بالآخرين أو انتقاده أمام الفصل."],

["Professional","Professionnel","مهني"],["Real questionnaires. Honest results.","De vrais questionnaires. Des résultats honnêtes.","استبيانات حقيقية. نتائج صادقة."],
["Every screener on StuWell is a published questionnaire that doctors, psychologists and researchers use around the world. Here is where each one comes from, so you know exactly what you are answering.","Chaque questionnaire de StuWell est un questionnaire publié, utilisé par des médecins, des psychologues et des chercheurs dans le monde entier. Voici d'où vient chacun d'eux, pour que vous sachiez exactement à quoi vous répondez.","كل استبيان في StuWell استبيان منشور يستخدمه الأطباء والأخصائيون النفسيون والباحثون حول العالم. إليك مصدر كل واحد منها لتعرف بالضبط على ماذا تجيب."],
["Measures","Mesure","يقيس"],["Period","Période","الفترة"],["Source","Source","المصدر"],
["Overall well-being","Bien-être général","الرفاهية العامة"],["Symptoms of low mood and depression","Symptômes d'humeur basse et de dépression","أعراض المزاج المنخفض والاكتئاب"],["Symptoms of anxiety","Symptômes d'anxiété","أعراض القلق"],["How stressful life has felt","À quel point la vie a semblé stressante","مدى شعورك بأن الحياة مرهقة"],["Psychological distress","Détresse psychologique","الضيق النفسي"],["Attention and activity patterns linked to ADHD","Schémas d'attention et d'activité liés au TDAH","أنماط الانتباه والنشاط المرتبطة باضطراب فرط الحركة وتشتت الانتباه"],

["World Health Organization, 1998","Organisation mondiale de la santé, 1998","منظمة الصحة العالمية، 1998"],["Kroenke, Spitzer and Williams, 2001","Kroenke, Spitzer et Williams, 2001","كرونكي وسبيتزر وويليامز، 2001"],["Spitzer, Kroenke, Williams and Löwe, 2006","Spitzer, Kroenke, Williams et Löwe, 2006","سبيتزر وكرونكي وويليامز ولوي، 2006"],["Cohen and colleagues, 1983 and 1988","Cohen et ses collègues, 1983 et 1988","كوهين وزملاؤه، 1983 و1988"],["Morris Rosenberg, 1965","Morris Rosenberg, 1965","موريس روزنبرغ، 1965"],["CORE System Trust, Barkham and colleagues, 2013","CORE System Trust, Barkham et ses collègues, 2013","CORE System Trust، باركهام وزملاؤه، 2013"],["World Health Organization with Kessler and colleagues, 2005","Organisation mondiale de la santé avec Kessler et ses collègues, 2005","منظمة الصحة العالمية مع كيسلر وزملائه، 2005"],
["Validated does not mean diagnosis","Validé ne veut pas dire diagnostic","المعتمد لا يعني التشخيص"],
["These questionnaires are validated: research has shown that they measure what they say they measure. But a questionnaire can only screen. A diagnosis needs a real conversation with a doctor, a psychiatrist or a psychologist, who looks at how long things have lasted and what else could explain them. That is why StuWell results always say \"your answers suggest\" and point you to the right person.","Ces questionnaires sont validés : la recherche a montré qu'ils mesurent bien ce qu'ils prétendent mesurer. Mais un questionnaire ne peut que dépister. Un diagnostic demande un véritable entretien avec un médecin, un psychiatre ou un psychologue, qui examine depuis combien de temps cela dure et ce qui pourrait l'expliquer. C'est pourquoi les résultats de StuWell disent toujours « vos réponses suggèrent » et vous orientent vers la bonne personne.","هذه الاستبيانات معتمدة: أثبتت الأبحاث أنها تقيس ما تقول إنها تقيسه. لكن الاستبيان لا يستطيع إلا الفحص الأولي. يحتاج التشخيص إلى محادثة حقيقية مع طبيب أو طبيب نفسي أو أخصائي نفسي، ينظر في مدة استمرار الأمر وما قد يفسره. لهذا تقول نتائج StuWell دائماً \"تشير إجاباتك\" وتوجّهك إلى الشخص المناسب."],
["Shaped by professional advice","Conçu avec l'avis d'un professionnel","مبني على نصيحة مختص"],
["Following a psychiatrist's advice, StuWell screens and guides, and never gives a diagnosis. Results point you to a psychologist, a doctor or your university's health service.","Suivant l'avis d'un psychiatre, StuWell dépiste et oriente, et ne pose jamais de diagnostic. Les résultats vous orientent vers un psychologue, un médecin ou le service de santé de votre université.","اتباعاً لنصيحة طبيب نفسي، يقوم StuWell بالفحص الأولي والتوجيه ولا يقدم أي تشخيص أبداً. توجّهك النتائج إلى أخصائي نفسي أو طبيب أو الخدمة الصحية في جامعتك."],
["Your data, your choice","Vos données, votre choix","بياناتك، قرارك"],
["Your answers stay on your phone unless you turn on sharing. Your individual screener answers are never stored, only the score. You can delete everything at any time.","Vos réponses restent sur votre téléphone, sauf si vous activez le partage. Vos réponses individuelles aux questionnaires ne sont jamais enregistrées, seulement le score. Vous pouvez tout effacer à tout moment.","تبقى إجاباتك على هاتفك ما لم تفعّل المشاركة. لا تُخزَّن إجاباتك الفردية على الاستبيانات أبداً، بل النتيجة فقط. يمكنك حذف كل شيء في أي وقت."],
["Honest about limits","Honnête sur ses limites","صريح بشأن حدوده"],
["StuWell is a student project. It is not watched in real time, and it does not replace a doctor, a psychologist or a counsellor.","StuWell est un projet étudiant. Il n'est pas surveillé en temps réel et ne remplace pas un médecin, un psychologue ou un conseiller.","StuWell مشروع طلابي. لا تتم مراقبته في الوقت الفعلي، ولا يحل محل الطبيب أو الأخصائي النفسي أو المرشد."],
["Help is always one tap away","L'aide est toujours à portée de main","المساعدة دائماً على بعد نقرة"],

["Email","E-mail","البريد الإلكتروني"],["Password","Mot de passe","كلمة المرور"],["Sign in","Se connecter","تسجيل الدخول"],["Sign out","Se déconnecter","تسجيل الخروج"],
["Sign out of the staff account","Se déconnecter du compte du personnel","تسجيل الخروج من حساب الموظفين"],
["Email or password is not correct.","L'e-mail ou le mot de passe est incorrect.","البريد الإلكتروني أو كلمة المرور غير صحيحة."],
["Could not connect. Check your internet connection.","Connexion impossible. Vérifiez votre connexion internet.","تعذّر الاتصال. تحقق من اتصالك بالإنترنت."],
["This account is not on the staff list yet. Ask the StuWell administrator to add it.","Ce compte ne figure pas encore sur la liste du personnel. Demandez à l'administrateur de StuWell de l'ajouter.","هذا الحساب غير موجود بعد في قائمة الموظفين. اطلب من مسؤول StuWell إضافته."],
["This area is for directors","Cet espace est réservé aux directeurs","هذا الفضاء مخصص للمديرين"],
["Your account is a professor account. Directors see sensitive details and reply to requests.","Votre compte est un compte professeur. Les directeurs voient les détails sensibles et répondent aux demandes.","حسابك حساب أستاذ. يرى المديرون التفاصيل الحساسة ويردون على الطلبات."],
["Go to the professor area","Aller à l'espace professeur","اذهب إلى فضاء الأستاذ"],
["Students need no account. Their phone gets a private, anonymous ID, and they only appear here after they turn on sharing.","Les étudiants n'ont pas besoin de compte. Leur téléphone reçoit un identifiant privé et anonyme, et ils n'apparaissent ici qu'après avoir activé le partage.","لا يحتاج الطلاب إلى حساب. يحصل هاتفهم على معرّف خاص ومجهول، ولا يظهرون هنا إلا بعد تفعيل المشاركة."],
["Directors and professors sign up with a confirmed school email address, then join their school with its access code or register it. They only see students from their own school.","Les directeurs et les professeurs s'inscrivent avec une adresse e-mail de l'école confirmée, puis rejoignent leur école avec son code d'accès ou l'inscrivent. Ils ne voient que les étudiants de leur propre école.","يسجّل المديرون والأساتذة ببريد مدرسي مؤكَّد، ثم ينضمون إلى مدرستهم برمز الدخول الخاص بها أو يسجّلونها. ولا يرون إلا طلاب مدرستهم."],
["Use your school email address. Personal addresses like Gmail or Hotmail, and student addresses, are not accepted.","Utilisez l'adresse e-mail de votre école. Les adresses personnelles comme Gmail ou Hotmail, et les adresses étudiantes, ne sont pas acceptées.","استخدم بريد مدرستك. لا تُقبل العناوين الشخصية مثل Gmail أو Hotmail ولا عناوين الطلاب."],
["Use your school email address. You will confirm it, then join or register your school.","Utilisez l'adresse e-mail de votre école. Vous la confirmerez, puis vous rejoindrez ou inscrirez votre école.","استخدم بريد مدرستك. ستؤكده ثم تنضم إلى مدرستك أو تسجّلها."],
["School email","E-mail de l'école","البريد المدرسي"],["Confirm your school email","Confirmez votre e-mail scolaire","أكّد بريدك المدرسي"],
["We sent a confirmation link to this address. Click it, then come back and press Continue.","Nous avons envoyé un lien de confirmation à cette adresse. Cliquez dessus, puis revenez et appuyez sur Continuer.","أرسلنا رابط تأكيد إلى هذا العنوان. اضغط عليه ثم عد واضغط على متابعة."],
["Check your spam folder if you do not see it.","Vérifiez vos courriers indésirables si vous ne le voyez pas.","تحقق من مجلد الرسائل غير المرغوب فيها إن لم تجده."],

["Email sent again","E-mail renvoyé","تمت إعادة إرسال البريد"],["Could not send the email. Try again in a minute.","Impossible d'envoyer l'e-mail. Réessayez dans une minute.","تعذّر إرسال البريد. حاول مجدداً بعد دقيقة."],
["This is a personal or student email address. Staff accounts need a school email address.","Ceci est une adresse e-mail personnelle ou étudiante. Les comptes du personnel nécessitent une adresse e-mail de l'école.","هذا عنوان بريد شخصي أو طلابي. تحتاج حسابات الموظفين إلى بريد المدرسة."],
["Finish your staff account","Terminez votre compte du personnel","أكمل حساب الموظف"],["Join my school","Rejoindre mon école","الانضمام إلى مدرستي"],["Register my school","Inscrire mon école","تسجيل مدرستي"],
["Join school","Rejoindre l'école","انضم إلى المدرسة"],["Register school","Inscrire l'école","سجّل المدرسة"],
["Ask your school's director for the access code for your role.","Demandez au directeur de votre école le code d'accès de votre rôle.","اطلب من مدير مدرستك رمز الدخول الخاص بدورك."],
["No school with your email address is registered yet. Register it instead.","Aucune école avec votre adresse e-mail n'est encore inscrite. Inscrivez-la plutôt.","لم تُسجَّل بعد أي مدرسة بعنوان بريدك. سجّلها بدلاً من ذلك."],
["You will be the first director of this school. StuWell creates its two access codes for you to give your colleagues.","Vous serez le premier directeur de cette école. StuWell crée ses deux codes d'accès pour que vous les donniez à vos collègues.","ستكون أول مدير لهذه المدرسة. ينشئ StuWell رمزي الدخول الخاصين بها لتعطيهما لزملائك."],
["This school is already registered. Choose Join my school.","Cette école est déjà inscrite. Choisissez Rejoindre mon école.","هذه المدرسة مسجّلة بالفعل. اختر الانضمام إلى مدرستي."],
["School registered. Its access codes are under Setup.","École inscrite. Ses codes d'accès se trouvent dans Configuration.","تم تسجيل المدرسة. توجد رموز الدخول الخاصة بها في الإعدادات."],
["Could not register the school. Try again.","Impossible d'inscrire l'école. Réessayez.","تعذّر تسجيل المدرسة. حاول مجدداً."],

["Write the school name first","Écrivez d'abord le nom de l'école","اكتب اسم المدرسة أولاً"],["Access codes for your school","Codes d'accès de votre école","رموز الدخول لمدرستك"],
["Each school has its own codes. A director code makes the person a director of that school, a professor code a professor. Staff only see students from their own school. If a code leaks, change it here; existing accounts stay until you remove them.","Chaque école a ses propres codes. Un code directeur fait de la personne un directeur de cette école, un code professeur un professeur. Le personnel ne voit que les étudiants de sa propre école. Si un code fuite, changez-le ici ; les comptes existants restent jusqu'à ce que vous les supprimiez.","لكل مدرسة رموزها الخاصة. رمز المدير يجعل الشخص مديراً لتلك المدرسة، ورمز الأستاذ يجعله أستاذاً. لا يرى الموظفون إلا طلاب مدرستهم. إذا تسرّب رمز فغيّره هنا؛ تبقى الحسابات الحالية حتى تحذفها."],
["No schools yet. Add the first one below.","Aucune école pour le moment. Ajoutez la première ci-dessous.","لا توجد مدارس بعد. أضف أول مدرسة أدناه."],
["You see all schools because you are a StuWell administrator.","Vous voyez toutes les écoles car vous êtes administrateur de StuWell.","ترى كل المدارس لأنك مسؤول StuWell."],
["Access code","Code d'accès","رمز الدخول"],["Ask your school's StuWell administrator for the access code.","Demandez le code d'accès à l'administrateur StuWell de votre école.","اطلب رمز الدخول من مسؤول StuWell في مدرستك."],
["This access code is not correct.","Ce code d'accès est incorrect.","رمز الدخول هذا غير صحيح."],["Access codes","Codes d'accès","رموز الدخول"],["Director code","Code directeur","رمز المدير"],["Professor code","Code professeur","رمز الأستاذ"],

function computeCheckin() {
  const a = S.ans, c = S.concerns;
  const idx = (a.mood + a.sleep + a.social + (6 - a.stress) + (6 - a.workload)) / 5;
  const flags = [];
  if (c.bullying) flags.push("bullying");
  if (c.home) flags.push("home");
  if (c.health) flags.push("health");
  if (a.mood <= 2) flags.push("lowMood");
  if (a.social <= 2) flags.push("lonely");
  if (a.sleep <= 2) flags.push("sleep");
  if (a.stress >= 4) flags.push("stress");
  if (a.workload >= 4) flags.push("workload");
  if (c.wantsTalk) flags.push("wantsTalk");
  return { idx, fc: FORECASTS.find(f => idx >= f.min), flags,
    tipKeys: TIP_ORDER.filter(k => flags.includes(k)).slice(0, 3), unsafe: !!c.unsafe, talk: !!c.wantsTalk || idx < 2.6,
    lasting: (S.dur === "2w" || S.dur === "more") && idx < 3.4 };
}

/* ---------- tool runtime: breathing and focus timer ---------- */
const R = { running: false, cycles: 0, bt: null };
const F = { mode: "focus", left: 1500, run: false, end: 0, iv: null, done: 0 };
function stopBreath() {
  clearTimeout(R.bt); R.running = false;
  const o = $("#orb"), b = $("#bbtn");
  if (o) { o.style.transition = "transform .6s ease-in-out"; o.style.transform = "scale(.6)"; o.textContent = "Ready"; }
  if (b) b.textContent = "Start";
}
function startBreath() {
  if (R.running) { stopBreath(); return; }
  R.running = true; R.cycles = 0;
  const ph = PATTERNS[S.pat].ph; let i = 0;
  $("#bbtn").textContent = "Stop"; $("#bcount").textContent = "Cycles: 0";
  const step = () => {
    const o = $("#orb");
    if (!R.running || !o) { R.running = false; return; }
    const [label, secs, sc] = ph[i];
    o.textContent = label;
    o.style.transition = `transform ${secs}s ease-in-out`;
    o.style.transform = `scale(${sc === 1 ? 1.3 : .6})`;
    R.bt = setTimeout(() => {
      i++;
      if (i >= ph.length) { i = 0; R.cycles++; const c = $("#bcount"); if (c) c.textContent = "Cycles: " + R.cycles; }
      step();
    }, secs * 1000);
  };
  requestAnimationFrame(step);
}
function fTotal() { return F.mode === "focus" ? 1500 : 300; }
function fPaint() {
  const t = $("#ftime"), b = $("#fbtn"), d = $("#fdone");
  if (t) t.textContent = fmtTime(F.left);
  if (b) b.textContent = F.run ? "Pause" : "Start";
  if (d) d.textContent = "Focus blocks finished this visit: " + F.done;
}
function fTick() {
  if (!F.run) return;
  F.left = Math.max(0, Math.round((F.end - Date.now()) / 1000));
  if (F.left <= 0) {
    F.run = false; clearInterval(F.iv);
    if (F.mode === "focus") F.done++;
    toast(F.mode === "focus" ? "Focus block done. Take 5 minutes." : "Break over. Ready when you are.");
    F.mode = F.mode === "focus" ? "break" : "focus"; F.left = fTotal();
  }
  fPaint();
}
function fToggle() {
  if (F.run) { F.run = false; clearInterval(F.iv); }
  else { F.run = true; F.end = Date.now() + F.left * 1000; clearInterval(F.iv); F.iv = setInterval(fTick, 500); }
  fPaint();
}

function replyFor(st, r) { const m = DIR.replies[st.id]; return m ? m["r_" + r.id] || null : null; }
function dirRequests() {
  const out = [];
  dirStudents().forEach(st => (st.requests || []).forEach(r => out.push({ st, r, rp: replyFor(st, r) })));
  return out.sort((a, b) => (a.rp ? 1 : 0) - (b.rp ? 1 : 0) || b.r.ts - a.r.ts);

function evalStudent(st) {
  const cks = (st.checkins || []).slice().sort((a, b) => a.ts - b.ts);
  const last = cks[cks.length - 1], now = Date.now();
  const fresh = !!last && now - last.ts < 14 * DAY;
  const fl = [];
  if (fresh) { (last.flags || []).forEach(f => fl.push(f)); if (last.unsafe) fl.push("unsafe"); }
  (st.checkups || []).filter(c => now - c.ts < 30 * DAY).forEach(c => {
    if (c.kind === "phq9") { if (c.safety) fl.push("screenSafety"); if (c.score >= 10) fl.push("screenPHQ"); }
    if (c.kind === "gad7" && c.score >= 10) fl.push("screenGAD");
    if (c.kind === "asrs" && c.score >= 4) fl.push("screenADHD");
    if (c.kind === "core10") { if (c.safety) fl.push("screenCoreSafety"); if (c.score >= 15) fl.push("screenCORE"); }
    if (c.kind === "rses" && c.score < 15) fl.push("screenRSES");
    if (c.kind === "who5" && c.score <= 28) fl.push("screenWHO");
    if (c.kind === "pss10" && c.score >= 27) fl.push("screenPSS");
  });
  if (fresh && cks.length >= 3) { const prev = cks.slice(-4, -1), avg = prev.reduce((s, c) => s + c.idx, 0) / prev.length; if (avg - last.idx >= 0.9) fl.push("decline"); }
  const flags = REASON_ORDER.filter(k => fl.includes(k));
  let level = "none";
  if (flags.includes("unsafe") || flags.includes("screenSafety") || flags.includes("screenCoreSafety")) level = "urgent";
  else if (["bullying", "home", "wantsTalk", "decline", "screenPHQ", "screenGAD", "screenWHO", "screenCORE"].some(k => flags.includes(k)) || (fresh && last.idx < 2.2)) level = "attention";
  else if (flags.length || (fresh && last.idx < 3.2)) level = "watch";
  else if (fresh) level = "stable";
  return { level, flags, last, idx: last ? last.idx : null, cks };
}
const levelPill = lv => `<span class="pill tone-${LEVEL_TONE[lv]}">${LEVEL_LABEL[lv]}</span>`;
function spark(cks) {
  const pts = cks.slice(-8); if (pts.length < 2) return "";
  const w = 120, h = 34, xs = i => 3 + i * (w - 6) / (pts.length - 1), ys = v => h - 3 - (Math.max(1, Math.min(5, v)) - 1) / 4 * (h - 6);
  const d = pts.map((c, i) => (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(c.idx).toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Trend of the last ${pts.length} check-ins"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${xs(pts.length - 1).toFixed(1)}" cy="${ys(pts[pts.length - 1].idx).toFixed(1)}" r="3.4" fill="currentColor"/></svg>`;
}

let lastHash = null;

  else if (m === "director") { S.mode = "director"; if (DTABS.includes(t)) S.dtab = t; }

const RQ_FIELDS = { "rq-type": "type", "rq-to": "to", "rq-from": "from", "rq-until": "until", "rq-name": "name", "rq-cls": "cls", "rq-notes": "notes" };

document.addEventListener("change", e => {
