<style>
/* Layout: one calm column on phones, two-column hero and card grids from tablet up. Warm cream ground, sage cards, terracotta for the always-visible Help now. */
:root{
  --bg:#F8F5EE; --surface:#FFFDF9; --surface-2:#F0ECE1; --ink:#15233B; --ink-soft:#4F5B6E; --line:#E4DED0;
  --sage:#E0EBDD; --sage-ink:#1F4A37; --primary:#3D6650; --on-primary:#FFFFFF;
  --clay:#F6D6C9; --clay-ink:#6A2B17;
  --blue:#1B6FC2; --brand-green:#0E7A52; --blue-soft:#E3EEF9;
  --ok-soft:#DCEBDD; --ok-ink:#1F5B3A; --warn-soft:#F7E8C4; --warn-ink:#6B4A06; --attn-soft:#F8DEC9; --attn-ink:#7A3A0B; --crit-soft:#F8DAD5; --crit-ink:#8A2318;
  --ill-a:#FBE4D5; --ill-b:#E3EDDD; --ill-sun:#F2B544; --ill-c1:#FFFDF9; --ill-c2:#C9DDC9; --ill-skin:#E8B793; --ill-hair:#4A3326; --ill-top:#3D6650; --ill-pants:#2B3E5C; --ill-bag:#D9805F; --ill-ground:#CFE0CF;
  --shadow:0 1px 2px rgba(21,35,59,.05),0 10px 28px rgba(21,35,59,.07);
  --f-display:'Fraunces','Iowan Old Style','Georgia',serif;
  --f-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-brand:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10181A; --surface:#172224; --surface-2:#1D2B2D; --ink:#EAF1EE; --ink-soft:#A9B7B1; --line:#2A3A3B;
  --sage:#1E3329; --sage-ink:#C3E3D0; --primary:#6FB38C; --on-primary:#0E1F16;
  --clay:#4A2A20; --clay-ink:#F6CDBD;
  --blue:#6DB0F2; --brand-green:#52C990; --blue-soft:#18304A;
  --ok-soft:#1E3329; --ok-ink:#BFE3CC; --warn-soft:#3F3414; --warn-ink:#F0D58A; --attn-soft:#4A2D17; --attn-ink:#F4C79F; --crit-soft:#4A211D; --crit-ink:#F5B7AE;
  --ill-a:#3A2B27; --ill-b:#1E3329; --ill-c1:#2E3F3E; --ill-c2:#35544A; --ill-skin:#D9A57F; --ill-hair:#6B4A38; --ill-top:#6FB38C; --ill-pants:#7FA7D6; --ill-bag:#E39A7A; --ill-ground:#274236;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181A; --surface:#172224; --surface-2:#1D2B2D; --ink:#EAF1EE; --ink-soft:#A9B7B1; --line:#2A3A3B;
  --sage:#1E3329; --sage-ink:#C3E3D0; --primary:#6FB38C; --on-primary:#0E1F16;
  --clay:#4A2A20; --clay-ink:#F6CDBD;
  --blue:#6DB0F2; --brand-green:#52C990; --blue-soft:#18304A;
  --ok-soft:#1E3329; --ok-ink:#BFE3CC; --warn-soft:#3F3414; --warn-ink:#F0D58A; --attn-soft:#4A2D17; --attn-ink:#F4C79F; --crit-soft:#4A211D; --crit-ink:#F5B7AE;
  --ill-a:#3A2B27; --ill-b:#1E3329; --ill-c1:#2E3F3E; --ill-c2:#35544A; --ill-skin:#D9A57F; --ill-hair:#6B4A38; --ill-top:#6FB38C; --ill-pants:#7FA7D6; --ill-bag:#E39A7A; --ill-ground:#274236;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;padding-block:0 56px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,7.2vw,3.7rem);font-weight:600;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,4.6vw,2.3rem)}
h3{font-size:1.3rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.soft{color:var(--ink-soft)}
.small{font-size:.9rem}
.label{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-soft)}
.mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:20px}
.sec{padding-block:44px 0;display:flex;flex-direction:column;gap:22px}
.sec-sub{max-width:58ch;color:var(--ink-soft)}
.ico{flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.wm{font-family:var(--f-brand);font-weight:800;font-size:1.75rem;line-height:1;letter-spacing:-.01em;display:inline-flex}
.wm .a{color:var(--blue)} .wm .b{color:var(--brand-green)}
.help-pill{display:inline-flex;align-items:center;gap:8px;background:var(--clay);color:var(--clay-ink);border:0;border-radius:999px;padding:11px 18px;min-height:46px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .15s}
.help-pill:hover{filter:brightness(.96)} .help-pill:active{transform:translateY(1px)}
.tabs{display:flex;gap:6px;padding-block:4px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--ink-soft);border-radius:999px;padding:11px 22px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:46px;transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:12px 22px;min-height:50px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s,filter .15s}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);padding-inline:28px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.clay{background:var(--clay);color:var(--clay-ink);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:14px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:42px;padding:8px 18px;font-size:.95rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;padding-block:34px 4px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--sage);color:var(--sage-ink);border-radius:999px;padding:9px 18px;font-weight:600;font-size:.95rem;width:fit-content}
.hero h1 em{font-style:italic;color:var(--primary);font-weight:500}
.hero p.lead{font-size:1.2rem;line-height:1.65;color:var(--ink-soft);max-width:46ch}
.privacy{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.95rem}
.illo{border-radius:30px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3;max-width:100%;background:var(--ill-b)}
.illo svg{display:block;width:100%;height:100%}
@media (min-width:860px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;padding-block:56px 8px}}

/* sage cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.sage-card{background:var(--sage);color:var(--sage-ink);border-radius:26px;padding:28px 26px 30px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sage-card h3{color:var(--ink)}
.sage-card p{color:var(--ink-soft);line-height:1.65}
.sage-card .ic{width:50px;height:50px;border-radius:15px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.checkup{text-align:left;border:0;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}
.checkup:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.checkup .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;font-weight:600;color:var(--sage-ink)}
.checkup .go{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--primary);margin-top:4px}

/* flow cards (check-in and screeners) */
.flow{max-width:720px;margin-inline:auto;padding-block:32px 0;display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:30px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.scale button,.opt{border:1px solid var(--line);background:var(--bg);border-radius:18px;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.scale button{min-height:68px;font-size:1.4rem;font-family:var(--f-display)}
.scale button:hover,.opt:hover{border-color:var(--primary);background:var(--sage)}
.scale button[aria-pressed="true"],.opt[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.anch{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--ink-soft)}
.optlist{display:grid;gap:10px}
.opt{text-align:left;padding:15px 20px;min-height:56px;font-size:1rem;font-weight:500}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;border:1px solid var(--line);border-radius:18px;background:var(--bg);cursor:pointer;line-height:1.45;transition:background .15s,border-color .15s}
.checks label:hover{border-color:var(--primary);background:var(--sage)}
.checks input{margin-top:3px;width:20px;height:20px;accent-color:var(--primary);flex:none}
.nav{display:flex;justify-content:space-between;gap:12px;align-items:center}

/* result */
.forecast{display:grid;gap:18px;align-items:center;background:var(--sage);color:var(--sage-ink);border-radius:28px;padding:28px 26px}
.forecast .wi{width:84px;height:84px;border-radius:24px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.forecast h2{color:var(--ink)}
.forecast .idx{font-weight:700;font-size:.95rem}
.tone-attn{background:var(--attn-soft);color:var(--attn-ink)} .tone-warn{background:var(--warn-soft);color:var(--warn-ink)}
.tone-crit{background:var(--crit-soft);color:var(--crit-ink)} .tone-ok{background:var(--ok-soft);color:var(--ok-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:500}
.crisis{background:var(--crit-soft);color:var(--crit-ink);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.crisis h3{color:inherit}
.note{background:var(--warn-soft);color:var(--warn-ink);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.note h3{color:inherit;font-size:1.15rem}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.tipgroup{border-left:3px solid var(--primary);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:4px}
.tipgroup ul{margin:4px 0 0;padding-left:18px}
.fine{font-size:.88rem;color:var(--ink-soft);line-height:1.55}

/* diary */
.diary{display:flex;flex-direction:column;gap:10px}
.dr{display:grid;grid-template-columns:78px minmax(0,1fr) 112px;gap:12px;align-items:center;font-size:.92rem}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.empty{border:1.5px dashed var(--line);border-radius:24px;padding:28px 22px;text-align:center;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;align-items:center}

/* tools */
.toolpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.tp{border:2px solid transparent;background:var(--sage);color:var(--sage-ink);border-radius:22px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,transform .15s}
.tp:hover{transform:translateY(-2px)}
.tp[aria-pressed="true"]{border-color:var(--primary);background:var(--surface)}
.tp b{font-family:var(--f-display);font-weight:600;font-size:1.1rem;color:var(--ink)}
.tp span.d{font-size:.88rem;color:var(--ink-soft);line-height:1.4}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:30px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.tool>*{max-width:560px}
.seg{display:inline-flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--ink-soft);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.orb-wrap{width:min(78vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.orb{width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--sage),var(--primary));transform:scale(.6);transition:transform 4s ease-in-out;display:flex;align-items:center;justify-content:center;color:var(--on-primary);font-weight:700;font-size:1.15rem;text-align:center}
.timer{font-family:var(--f-display);font-size:clamp(3.4rem,16vw,5.4rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.gstep{font-family:var(--f-display);font-size:clamp(1.5rem,5vw,2rem);line-height:1.25}
.gnum{font-family:var(--f-display);font-size:4.4rem;color:var(--primary);line-height:1}
textarea.field,select.field,input.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 16px;min-height:52px;font-size:1rem}
textarea.field{min-height:140px;resize:vertical;line-height:1.55}
textarea.field:focus,select.field:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent)}
.wd{transition:opacity .6s,transform .6s}
.wd.gone{opacity:0;transform:translateY(-14px) scale(.98)}
.ckl{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}

/* topics, builder, faq */
.topics{display:flex;flex-direction:column;gap:12px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.topic-h,.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:none;border:0;padding:20px 24px;cursor:pointer;min-height:64px}
.topic-h:hover,.faq-q:hover{background:var(--surface-2)}
.topic-h b,.faq-q span:first-child{font-family:var(--f-display);font-weight:600;font-size:1.15rem;line-height:1.3}
.chev{flex:none;transition:transform .2s;color:var(--ink-soft)}
.topic-b{padding:4px 24px 26px;display:flex;flex-direction:column;gap:14px}
.topic-b ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.seek{background:var(--warn-soft);color:var(--warn-ink);border-radius:16px;padding:14px 18px}
.builder{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.fields{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-weight:600;font-size:.92rem}
.msgbox{background:var(--sage);color:var(--ink);border-radius:22px;padding:22px 24px;font-size:1.05rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.faq{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.faq-i{border-bottom:1px solid var(--line)} .faq-i:last-child{border-bottom:0}
.faq-a{padding:0 24px 24px;color:var(--ink-soft);line-height:1.7;max-width:66ch}
.reach{display:flex;gap:16px;align-items:center;background:var(--clay);color:var(--clay-ink);border-radius:26px;padding:24px 26px;flex-wrap:wrap;justify-content:space-between}
.reach p{max-width:46ch}
.reach h3{color:inherit}

/* medical request */
.mr{display:grid;gap:24px;align-items:start}
@media (min-width:900px){.mr{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}}
.req{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.req p{overflow-wrap:anywhere}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:700;white-space:nowrap}
select.field.inl{width:auto;min-height:42px;padding:8px 14px}
input.field{min-width:0}

/* dialog */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(10,20,22,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.dialog{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:26px max(22px,env(safe-area-inset-left,0px)) max(26px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.numrow{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:var(--bg)}
.numrow .n{font-family:var(--f-display);font-size:1.7rem;font-weight:600;color:var(--clay-ink);background:var(--clay);border-radius:12px;padding:2px 14px;text-decoration:none;font-variant-numeric:tabular-nums}
.numrow div{min-width:0}

/* ===== professional polish: brand gradient, glass header, depth, rhythm ===== */
:root{--g1:#1B6FC2;--g2:#0E7A52;--on-g:#FFFFFF;--navy:#0F1B33;--navy-2:#16294A;--glow:rgba(27,111,194,.35);--brand-grad:linear-gradient(135deg,var(--g1),var(--g2))}

.btn{transition:transform .15s,box-shadow .2s,border-color .15s,background .15s}
.btn.primary{background:var(--brand-grad);color:var(--on-g);border-color:transparent;box-shadow:0 10px 24px -8px var(--glow)}
.btn.primary:hover{filter:none;transform:translateY(-2px);box-shadow:0 16px 30px -10px var(--glow)}
.btn.light{box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}

.tab[aria-current="page"]{background:color-mix(in srgb,var(--g1) 14%,var(--surface));color:var(--ink);box-shadow:inset 0 -2px 0 var(--g1)}
.panel,.req,.dstat,.listcard,.st{box-shadow:0 1px 2px rgba(15,27,51,.04),0 14px 34px -14px rgba(15,27,51,.18)}
.dstat{position:relative;overflow:hidden}.dstat::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--brand-grad)}
.dstat b{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.door{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 36px -18px rgba(15,27,51,.5)}
.door::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.door.stu{background:linear-gradient(145deg,#0A5A3E,#0E7A52);color:#fff}
.door.prof{background:linear-gradient(145deg,#124E9C,#1F6FC9);color:#fff}
.door.dir{background:linear-gradient(145deg,#1B2E52,#0A1325);color:#fff}
.door .go{transition:gap .2s}.door:hover .go{gap:14px}
.mock .illo{border:6px solid var(--surface);border-radius:38px;transform:rotate(-1.4deg);transition:transform .4s}
.mock:hover .illo{transform:rotate(0)}
.fl{border-radius:18px;backdrop-filter:blur(8px)}
.lstats{border:0;background:transparent;gap:14px}
.lstat{border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 30px -18px rgba(15,27,51,.25)}
.lstat b{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2.6rem}
.kicker{display:inline-flex;align-items:center;gap:8px;width:fit-content;background:color-mix(in srgb,var(--g1) 10%,var(--surface));color:color-mix(in srgb,var(--g1) 85%,var(--ink));border-radius:999px;padding:6px 14px;letter-spacing:.1em}
.t-clay .kicker,.t-ink .kicker{background:rgba(255,255,255,.16);color:inherit}
.lh h2{font-size:clamp(2rem,5.6vw,3.2rem);letter-spacing:-.02em}
.bt{box-shadow:0 20px 40px -26px rgba(15,27,51,.35);transition:transform .25s,box-shadow .25s}
.bt:hover{transform:translateY(-4px);box-shadow:0 28px 50px -24px rgba(15,27,51,.4)}
.t-sage{background:linear-gradient(150deg,color-mix(in srgb,var(--g2) 18%,var(--surface)),color-mix(in srgb,var(--g2) 8%,var(--bg)))}
.t-blue{background:linear-gradient(150deg,color-mix(in srgb,var(--g1) 20%,var(--surface)),color-mix(in srgb,var(--g1) 8%,var(--bg)))}
.t-ink{background:radial-gradient(520px 260px at 90% 0,color-mix(in srgb,var(--g1) 45%,transparent),transparent 70%),linear-gradient(150deg,var(--navy-2),var(--navy));color:#EAF1F8}
.t-ink h3{color:#fff}.t-ink p{color:rgba(234,241,248,.8)}
.mini-bars i{background:var(--brand-grad)}
.orb-mini{background:radial-gradient(circle at 35% 30%,#fff,var(--g2) 55%,var(--g1))}
.steps3{counter-reset:s}
.st{border-radius:30px;position:relative;overflow:hidden}
.st .no{background:var(--brand-grad);color:var(--on-g);box-shadow:0 10px 20px -8px var(--glow)}
.ap.stu{background:linear-gradient(150deg,color-mix(in srgb,var(--g2) 20%,var(--surface)),color-mix(in srgb,var(--g2) 8%,var(--bg)))}
.ap.prof{background:linear-gradient(150deg,color-mix(in srgb,var(--g1) 22%,var(--surface)),color-mix(in srgb,var(--g1) 8%,var(--bg)))}
.ap.dir{background:radial-gradient(480px 240px at 100% 0,color-mix(in srgb,var(--g1) 40%,transparent),transparent 70%),linear-gradient(150deg,var(--navy-2),var(--navy));color:#EAF1F8}
.ap.dir h3{color:#fff}.ap.dir li{color:#EAF1F8}
.ap li .ico{color:var(--g1)}.ap.dir li .ico{color:#9CC9F5}
.cta{position:relative;overflow:hidden;background:radial-gradient(600px 300px at 15% 0,rgba(255,255,255,.22),transparent 65%),radial-gradient(500px 300px at 100% 100%,rgba(0,0,0,.25),transparent 65%),linear-gradient(135deg,#17569E,#0B6B47);color:#fff}
.cta .btn.light{color:#0F1B33}.cta .btn.line-light{color:#fff;border-color:rgba(255,255,255,.7)}
.phone{border-radius:40px;box-shadow:var(--shadow-lg);position:relative}
.range{accent-color:var(--g1)}
.demo-out{background:linear-gradient(135deg,color-mix(in srgb,var(--g2) 18%,var(--surface)),color-mix(in srgb,var(--g1) 14%,var(--surface)))}
.faq-l{display:flex;flex-direction:column;gap:10px;max-width:820px}
.faq-l details{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px 22px;transition:box-shadow .2s}
.faq-l details[open]{box-shadow:0 14px 30px -18px rgba(15,27,51,.3);border-color:color-mix(in srgb,var(--g1) 35%,var(--line))}
.faq-l summary{cursor:pointer;list-style:none;padding:16px 0;font-weight:600;display:flex;justify-content:space-between;gap:14px;align-items:center;min-height:56px}
.faq-l summary::-webkit-details-marker{display:none}
.faq-l summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--g1);transition:transform .2s}
.faq-l details[open] summary::after{transform:rotate(45deg)}
.faq-l p{color:var(--ink-soft);padding-bottom:18px;line-height:1.65}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;color:var(--ink-soft);font-size:.92rem}
.trust span{display:inline-flex;gap:8px;align-items:center}.trust .ico{color:var(--g2)}
.lfoot{border-top:0;position:relative}.lfoot::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--line) 15%,var(--line) 85%,transparent)}
.menu{box-shadow:0 30px 70px -20px rgba(15,27,51,.45)}
.nl:hover{background:color-mix(in srgb,var(--g1) 10%,var(--surface))}

/* readability fixes */
.btn.primary{background:linear-gradient(135deg,#1760B0,#0B6B47)}
.st .no{background:linear-gradient(135deg,#1760B0,#0B6B47);color:#fff}
.orb,.orb-mini{background:radial-gradient(circle at 35% 30%,#2E9E77,#0B6B47)}
.orb{color:#fff!important;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.cta .btn.light{background:#fff;color:#0F1B33}
.cta .btn.line-light{border-color:#fff;color:#fff}
.t-ink .kicker,.t-ink .kicker *{color:#EAF1F8!important}
.door p,.door .go{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:linear-gradient(135deg,#4C9BEA,#3FBF86)}:root:not([data-theme="light"]) .st .no{background:linear-gradient(135deg,#4C9BEA,#3FBF86);color:#08141A}}
:root[data-theme="dark"] .btn.primary{background:linear-gradient(135deg,#4C9BEA,#3FBF86)}:root[data-theme="dark"] .st .no{background:linear-gradient(135deg,#4C9BEA,#3FBF86);color:#08141A}

.lang-wrap{display:inline-flex;flex:none}

html[lang="ar"] body,html[lang="ar"] button,html[lang="ar"] input,html[lang="ar"] select,html[lang="ar"] textarea{font-family:"Noto Sans Arabic","DM Sans",system-ui,sans-serif;letter-spacing:0}

html[dir="rtl"] body{text-align:right}
html[dir="rtl"] .ico{transform:none}

html[dir="rtl"] ul,html[dir="rtl"] ol{padding-inline-start:1.2em;padding-left:0}

html[dir="rtl"] .msgbox{direction:rtl;text-align:right}

/* screening notice */
.note.dx{background:var(--blue-soft);color:var(--ink)}

["Do one small thing today that you usually enjoy.","Faites aujourd'hui une petite chose que vous aimez d'habitude.","افعل اليوم شيئاً صغيراً تستمتع به عادةً."],
["Tell someone you trust how you feel, even in one sentence.","Dites à quelqu'un de confiance ce que vous ressentez, même en une phrase.","أخبر شخصاً تثق به بما تشعر، ولو بجملة واحدة."],
["Keep the same bedtime for a week.","Gardez la même heure de coucher pendant une semaine.","حافظ على موعد النوم نفسه لمدة أسبوع."],
["Put your phone away for the last hour before sleeping.","Rangez votre téléphone pendant la dernière heure avant de dormir.","ابتعد عن هاتفك في الساعة الأخيرة قبل النوم."],
["Try breathing in for 4 seconds and out for 6, five times.","Essayez d'inspirer pendant 4 secondes et d'expirer pendant 6, cinq fois.","جرّب الشهيق لمدة 4 ثوانٍ والزفير لمدة 6، خمس مرات."],
["Write down what you can control today, and leave the rest.","Notez ce que vous pouvez contrôler aujourd'hui et laissez le reste.","اكتب ما يمكنك التحكم به اليوم ودَع الباقي."],
["Send one friendly message to a classmate.","Envoyez un message amical à un camarade.","أرسل رسالة ودّية إلى زميل في الفصل."],
["Join one activity or club that fits your interests.","Rejoignez une activité ou un club qui correspond à vos intérêts.","انضم إلى نشاط أو نادٍ يناسب اهتماماتك."],
["List everything due, then choose only the next one.","Listez tout ce qui est à rendre, puis choisissez seulement la prochaine tâche.","اكتب كل ما هو مطلوب ثم اختر المهمة التالية فقط."],
["Ask your teacher about an extension. It is a normal request.","Demandez un délai supplémentaire à votre professeur. C'est une demande normale.","اطلب من أستاذك تمديد الموعد. إنه طلب عادي."],
["It is not your fault. Tell a teacher or the director you trust.","Ce n'est pas votre faute. Parlez-en à un professeur ou au directeur en qui vous avez confiance.","ليس ذلك خطأك. أخبر أستاذاً أو المدير الذي تثق به."],
["Stay near friends or adults during breaks.","Restez près de vos amis ou d'adultes pendant les pauses.","ابقَ قرب أصدقائك أو الكبار أثناء الاستراحات."],
["You do not have to explain everything. Even one trusted adult at school can help.","Vous n'avez pas à tout expliquer. Un seul adulte de confiance à l'école peut aider.","لا يلزمك شرح كل شيء. يمكن لشخص بالغ موثوق واحد في المدرسة أن يساعد."],
["Ask the counsellor for a quiet space to talk.","Demandez au conseiller un endroit calme pour parler.","اطلب من المرشد مكاناً هادئاً للحديث."],
["Visit the school nurse or a doctor if you are in pain or unwell.","Voyez l'infirmier(ère) de l'école ou un médecin si vous avez mal ou ne vous sentez pas bien.","زر ممرض المدرسة أو طبيباً إذا كنت تشعر بألم أو لست بخير."],
["You can prepare a request for an exam change, an absence or mobility support in the Medical request tab.","Vous pouvez préparer une demande de changement d'examen, d'absence ou d'aide à la mobilité dans l'onglet Demande médicale.","يمكنك إعداد طلب لتغيير امتحان أو غياب أو دعم للتنقل في قسم الطلب الطبي."],
["Keep it going","Continuez ainsi","واصل هكذا"],["Notice what helped today and do it again tomorrow.","Remarquez ce qui vous a aidé aujourd'hui et refaites-le demain.","لاحظ ما ساعدك اليوم وكرّره غداً."],["A two-minute breathing break is a good habit before a busy day.","Une pause respiration de deux minutes est une bonne habitude avant une journée chargée.","استراحة تنفس لمدة دقيقتين عادة جيدة قبل يوم مزدحم."],

["Today looks bright. Notice what is helping and keep it going.","La journée s'annonce lumineuse. Remarquez ce qui vous aide et continuez.","يبدو اليوم مشرقاً. لاحظ ما يساعدك وواصل."],
["Mostly steady, with a few clouds. A small reset can keep it that way.","Plutôt stable, avec quelques nuages. Une petite pause peut maintenir cet état.","مستقر في الغالب مع بعض الغيوم. قد تساعد استراحة صغيرة على بقاء الحال هكذا."],
["A mixed day. Some things feel heavy, and it is worth noticing that.","Une journée mitigée. Certaines choses pèsent, et cela mérite d'être remarqué.","يوم متباين. بعض الأشياء تبدو ثقيلة، ومن المفيد أن تلاحظ ذلك."],
["A hard day. You do not have to carry it alone, and small steps count.","Une journée difficile. Vous n'avez pas à la porter seul(e), et les petits pas comptent.","يوم صعب. لا يجب أن تتحمله وحدك، والخطوات الصغيرة مهمة."],
["A very heavy day. Be gentle with yourself and reach out to someone today.","Une journée très lourde. Soyez doux(ce) avec vous-même et tournez-vous vers quelqu'un aujourd'hui.","يوم ثقيل جداً. كن لطيفاً مع نفسك وتواصل مع شخص ما اليوم."],
["You said you feel unsafe","Vous avez dit ne pas vous sentir en sécurité","قلتَ إنك لا تشعر بالأمان"],
["Thank you for being honest. Please do not stay alone with this. Tell someone near you now, or contact emergency services. If you might act on thoughts of hurting yourself, call your local emergency number or go to the nearest emergency department.","Merci d'avoir été honnête. Ne restez pas seul(e) avec cela. Parlez-en maintenant à quelqu'un près de vous ou contactez les services d'urgence. Si vous risquez de passer à l'acte, appelez le numéro d'urgence local ou rendez-vous aux urgences les plus proches.","شكراً لصراحتك. من فضلك لا تبقَ وحدك مع هذا. أخبر شخصاً قريباً منك الآن أو اتصل بخدمات الطوارئ. إذا كنت قد تُقدم على إيذاء نفسك فاتصل برقم الطوارئ المحلي أو توجّه إلى أقرب قسم طوارئ."],

["A short chat with a counsellor, a doctor or someone you trust can make a hard day lighter.","Une courte discussion avec un conseiller, un médecin ou une personne de confiance peut alléger une journée difficile.","محادثة قصيرة مع مرشد أو طبيب أو شخص تثق به قد تخفف يوماً صعباً."],

["Over the last 2 weeks you reported few signs of depression. Keep the habits that protect your mood: regular sleep, movement and time with people you like.","Au cours des 2 dernières semaines, vous avez signalé peu de signes de dépression. Gardez les habitudes qui protègent votre humeur : un sommeil régulier, du mouvement et du temps avec des personnes que vous aimez.","خلال الأسبوعين الماضيين أبلغتَ عن علامات قليلة للاكتئاب. حافظ على العادات التي تحمي مزاجك: نوم منتظم وحركة ووقت مع من تحب."],
["You reported some signs of low mood. This is common and often improves with small changes, but keep watching it. If it continues for two more weeks, talk to someone.","Vous avez signalé quelques signes d'humeur basse. C'est courant et cela s'améliore souvent avec de petits changements, mais restez attentif(ve). Si cela continue deux semaines de plus, parlez à quelqu'un.","أبلغتَ عن بعض علامات المزاج المنخفض. هذا شائع وغالباً ما يتحسن بتغييرات صغيرة، لكن راقبه. إذا استمر أسبوعين إضافيين فتحدث مع شخص ما."],
["Your answers show a level of low mood that health professionals recommend looking at properly. This does not mean you have depression, but it is a good reason to talk to a counsellor or a doctor.","Vos réponses montrent un niveau d'humeur basse que les professionnels de santé recommandent d'examiner sérieusement. Cela ne signifie pas que vous êtes déprimé(e), mais c'est une bonne raison de parler à un conseiller ou à un médecin.","تُظهر إجاباتك مستوى من المزاج المنخفض يوصي المختصون الصحيون بفحصه جيداً. هذا لا يعني أنك مصاب بالاكتئاب، لكنه سبب وجيه للتحدث مع مرشد أو طبيب."],
["Your answers show significant signs of depression. Please talk to a counsellor, a doctor or a trusted adult soon. Treatment works, and you do not have to manage this alone.","Vos réponses montrent des signes importants de dépression. Parlez bientôt à un conseiller, à un médecin ou à un adulte de confiance. Le traitement fonctionne et vous n'avez pas à gérer cela seul(e).","تُظهر إجاباتك علامات واضحة للاكتئاب. من فضلك تحدث قريباً مع مرشد أو طبيب أو شخص بالغ موثوق. العلاج ينجح ولا يجب أن تواجه ذلك وحدك."],
["Your answers show many signs of depression, and they are affecting you a lot. Please speak to a counsellor or a doctor this week, and tell an adult you trust.","Vos réponses montrent de nombreux signes de dépression, et ils vous affectent beaucoup. Parlez à un conseiller ou à un médecin cette semaine et informez un adulte de confiance.","تُظهر إجاباتك علامات كثيرة للاكتئاب وهي تؤثر فيك كثيراً. من فضلك تحدث مع مرشد أو طبيب هذا الأسبوع وأخبر شخصاً بالغاً تثق به."],

["Over the last 2 weeks you reported few signs of anxiety. Keep the routines that help you stay calm.","Au cours des 2 dernières semaines, vous avez signalé peu de signes d'anxiété. Gardez les routines qui vous aident à rester calme.","خلال الأسبوعين الماضيين أبلغتَ عن علامات قليلة للقلق. حافظ على الروتين الذي يساعدك على البقاء هادئاً."],
["You reported some worry and tension. This is common, especially around exams. The steps below usually help, and talking to someone helps even more.","Vous avez signalé de l'inquiétude et de la tension. C'est courant, surtout autour des examens. Les étapes ci-dessous aident généralement, et parler à quelqu'un aide encore plus.","أبلغتَ عن بعض القلق والتوتر. هذا شائع خاصة قبيل الامتحانات. تساعد الخطوات أدناه عادةً، والتحدث مع شخص ما يساعد أكثر."],
["Your answers show a level of anxiety that health professionals recommend looking at properly. This does not mean you have an anxiety disorder, but it is a good reason to talk to a counsellor or a doctor.","Vos réponses montrent un niveau d'anxiété que les professionnels de santé recommandent d'examiner sérieusement. Cela ne signifie pas que vous avez un trouble anxieux, mais c'est une bonne raison de parler à un conseiller ou à un médecin.","تُظهر إجاباتك مستوى من القلق يوصي المختصون الصحيون بفحصه جيداً. هذا لا يعني أنك مصاب باضطراب قلق، لكنه سبب وجيه للتحدث مع مرشد أو طبيب."],
["Your answers show many signs of anxiety, and they are affecting you a lot. Please speak to a counsellor or a doctor soon. Anxiety is very treatable.","Vos réponses montrent de nombreux signes d'anxiété, et ils vous affectent beaucoup. Parlez bientôt à un conseiller ou à un médecin. L'anxiété se traite très bien.","تُظهر إجاباتك علامات كثيرة للقلق وهي تؤثر فيك كثيراً. من فضلك تحدث قريباً مع مرشد أو طبيب. القلق قابل للعلاج جداً."],
["Few signs of attention difficulties","Peu de signes de difficultés d'attention","علامات قليلة لصعوبات الانتباه"],["Some attention and organization difficulties","Quelques difficultés d'attention et d'organisation","بعض صعوبات الانتباه والتنظيم"],["Many answers match patterns seen in ADHD","De nombreuses réponses correspondent aux schémas observés dans le TDAH","إجابات كثيرة تطابق أنماطاً تُرى في اضطراب فرط الحركة وتشتت الانتباه"],
["Your answers show few of the patterns linked to ADHD. If focus still feels hard, the tips below can help.","Vos réponses montrent peu des schémas liés au TDAH. Si la concentration reste difficile, les conseils ci-dessous peuvent aider.","تُظهر إجاباتك القليل من الأنماط المرتبطة باضطراب فرط الحركة وتشتت الانتباه. إذا ظل التركيز صعباً فقد تساعد النصائح أدناه."],
["Some of your answers match attention and organization difficulties. ADHD is one possible reason, and so are stress, poor sleep, anxiety and low mood. Try the strategies below, and talk to someone if it continues.","Certaines de vos réponses correspondent à des difficultés d'attention et d'organisation. Le TDAH est une raison possible, tout comme le stress, le mauvais sommeil, l'anxiété et l'humeur basse. Essayez les stratégies ci-dessous et parlez à quelqu'un si cela continue.","تطابق بعض إجاباتك صعوبات في الانتباه والتنظيم. قد يكون السبب اضطراب فرط الحركة وتشتت الانتباه، وكذلك التوتر وقلة النوم والقلق والمزاج المنخفض. جرّب الاستراتيجيات أدناه وتحدث مع شخص ما إذا استمر الأمر."],
["Four or more of your six answers match patterns seen in ADHD. This questionnaire cannot diagnose ADHD, but a score like this means a professional evaluation is worth asking for. Poor sleep, anxiety and low mood can look similar, so a professional should look at the whole picture.","Quatre de vos six réponses ou plus correspondent aux schémas observés dans le TDAH. Ce questionnaire ne peut pas diagnostiquer le TDAH, mais un tel score justifie de demander une évaluation professionnelle. Le mauvais sommeil, l'anxiété et l'humeur basse peuvent se ressembler, un professionnel doit donc examiner l'ensemble.","أربع إجابات أو أكثر من إجاباتك الست تطابق أنماطاً تُرى في اضطراب فرط الحركة وتشتت الانتباه. لا يستطيع هذا الاستبيان التشخيص، لكن هذه النتيجة تعني أن طلب تقييم مختص أمر جدير بالاهتمام. قد تتشابه أعراض قلة النوم والقلق والمزاج المنخفض، لذا ينبغي أن ينظر مختص إلى الصورة كاملة."],

["What can help","Ce qui peut aider","ما الذي يمكن أن يساعد"],
["Take this result to a counsellor or a doctor. The Get support tab can write a first message for you.","Apportez ce résultat à un conseiller ou à un médecin. L'onglet Obtenir du soutien peut écrire un premier message pour vous.","خذ هذه النتيجة إلى مرشد أو طبيب. يمكن لقسم الدعم أن يكتب لك رسالة أولى."],
["This result describes your answers to a screening questionnaire. It is not a medical diagnosis.","Ce résultat décrit vos réponses à un questionnaire de dépistage. Ce n'est pas un diagnostic médical.","تصف هذه النتيجة إجاباتك على استبيان فحص أولي. وهي ليست تشخيصاً طبياً."],
["This result describes your answers to a screening questionnaire. The ASRS was designed for adults, so for younger students it only shows whether it is worth asking a professional. It is not a medical diagnosis.","Ce résultat décrit vos réponses à un questionnaire de dépistage. L'ASRS a été conçu pour les adultes ; pour les plus jeunes, il indique seulement s'il vaut la peine de consulter un professionnel. Ce n'est pas un diagnostic médical.","تصف هذه النتيجة إجاباتك على استبيان فحص أولي. صُمم مقياس ASRS للبالغين، لذا فهو للطلاب الأصغر سناً يوضح فقط ما إذا كان من المفيد استشارة مختص. وهو ليس تشخيصاً طبياً."],
["Your individual answers are never stored. Only the score is kept.","Vos réponses individuelles ne sont jamais enregistrées. Seul le score est conservé.","لا تُخزَّن إجاباتك الفردية أبداً. تُحفظ النتيجة فقط."],
["Short, validated questionnaires that health professionals use to screen for low well-being, low mood, anxiety, stress, low self-esteem, distress and attention difficulties. They do not give a diagnosis. They show whether it is worth talking to a professional.","De courts questionnaires validés, utilisés par les professionnels de santé pour repérer un bien-être bas, une humeur basse, l'anxiété, le stress, une faible estime de soi, la détresse et les difficultés d'attention. Ils ne donnent pas de diagnostic. Ils montrent s'il vaut la peine de parler à un professionnel.","استبيانات قصيرة ومعتمدة يستخدمها المختصون الصحيون للكشف عن انخفاض الرفاهية والمزاج المنخفض والقلق والتوتر وتدني تقدير الذات والضيق النفسي وصعوبات الانتباه. لا تقدم تشخيصاً. إنها توضح ما إذا كان من المفيد التحدث مع مختص."],
["Your recent results","Vos résultats récents","نتائجك الأخيرة"],
["Only the score is saved, on this device. Your individual answers are never stored. Scores are shared with your school only if you turned sharing on.","Seul le score est enregistré, sur cet appareil. Vos réponses individuelles ne sont jamais enregistrées. Les scores ne sont partagés avec votre école que si vous avez activé le partage.","تُحفظ النتيجة فقط على هذا الجهاز. لا تُخزَّن إجاباتك الفردية أبداً. لا تُشارك النتائج مع مدرستك إلا إذا فعّلت المشاركة."],

["Campus counselling","Conseil sur le campus","الإرشاد في الحرم الجامعي"],["Most schools and universities offer free, confidential counselling for enrolled students. Ask at the administration office, or look for \"wellbeing\" or \"student services\" on your institution's website.","La plupart des écoles et universités proposent un accompagnement gratuit et confidentiel aux étudiants inscrits. Renseignez-vous auprès de l'administration ou cherchez « bien-être » ou « services aux étudiants » sur le site de votre établissement.","تقدم معظم المدارس والجامعات إرشاداً مجانياً وسرياً للطلاب المسجلين. اسأل في مكتب الإدارة أو ابحث عن \"الرفاهية\" أو \"خدمات الطلاب\" في موقع مؤسستك."],
["A doctor or GP","Un médecin ou médecin généraliste","طبيب أو طبيب عام"],["If low mood, anxiety or sleep problems have lasted more than two weeks, a doctor can talk through your options and refer you to specialist care.","Si l'humeur basse, l'anxiété ou les troubles du sommeil durent plus de deux semaines, un médecin peut discuter de vos options et vous orienter vers un spécialiste.","إذا استمر المزاج المنخفض أو القلق أو مشاكل النوم أكثر من أسبوعين فيمكن للطبيب مناقشة خياراتك وتحويلك إلى رعاية متخصصة."],
["Someone you trust","Quelqu'un de confiance","شخص تثق به"],["A friend, family member, tutor or school adult. You do not need the perfect words: \"I've been struggling lately\" is enough.","Un ami, un membre de la famille, un tuteur ou un adulte de l'école. Vous n'avez pas besoin des mots parfaits : « J'ai du mal en ce moment » suffit.","صديق أو فرد من العائلة أو مشرف أو بالغ في المدرسة. لا تحتاج إلى كلمات مثالية: \"أمرّ بوقت صعب مؤخراً\" تكفي."],
["Reach out in one minute","Tendre la main en une minute","تواصل خلال دقيقة"],["Not sure what to say? Choose a few options and StuWell writes a first message you can send.","Vous ne savez pas quoi dire ? Choisissez quelques options et StuWell rédige un premier message que vous pouvez envoyer.","لا تعرف ماذا تقول؟ اختر بعض الخيارات ويكتب StuWell رسالة أولى يمكنك إرسالها."],

["Understand what you feel","Comprendre ce que vous ressentez","افهم ما تشعر به"],["General information to help you recognize what is happening. It does not replace a doctor or a psychologist.","Informations générales pour vous aider à reconnaître ce qui se passe. Elles ne remplacent pas un médecin ou un psychologue.","معلومات عامة لمساعدتك على إدراك ما يحدث. لا تحل محل الطبيب أو الأخصائي النفسي."],
["Common signs","Signes courants","علامات شائعة"],["When to get help.","Quand demander de l'aide.","متى تطلب المساعدة."],
["Depression","Dépression","الاكتئاب"],["depression","la dépression","الاكتئاب"],["Low mood that lasts","Une humeur basse qui dure","مزاج منخفض يستمر"],
["More than feeling sad. Depression is a health condition that lowers mood and energy for weeks. It is common in teenagers and adults, and it is treatable.","Plus que de la tristesse. La dépression est un problème de santé qui abaisse l'humeur et l'énergie pendant des semaines. Elle est courante chez les adolescents et les adultes, et elle se soigne.","أكثر من مجرد حزن. الاكتئاب حالة صحية تخفض المزاج والطاقة لأسابيع. وهو شائع بين المراهقين والبالغين وقابل للعلاج."],
["Feeling sad, empty or irritable most of the day for 2 weeks or more","Se sentir triste, vide ou irritable la plupart de la journée pendant 2 semaines ou plus","الشعور بالحزن أو الفراغ أو الانفعال معظم اليوم لمدة أسبوعين أو أكثر"],
["Losing interest in things you used to enjoy","Perdre l'intérêt pour des choses que vous aimiez","فقدان الاهتمام بأشياء كنت تستمتع بها"],["Sleeping much more or much less than usual","Dormir beaucoup plus ou beaucoup moins que d'habitude","النوم أكثر بكثير أو أقل بكثير من المعتاد"],["Constant tiredness or trouble concentrating","Fatigue constante ou difficulté à se concentrer","تعب مستمر أو صعوبة في التركيز"],["Feeling worthless or guilty","Se sentir sans valeur ou coupable","الشعور بانعدام القيمة أو الذنب"],["Pulling away from friends and family","S'éloigner de ses amis et de sa famille","الابتعاد عن الأصدقاء والعائلة"],
["Tell one adult you trust how you have been feeling.","Dites à un adulte de confiance comment vous vous sentez.","أخبر شخصاً بالغاً تثق به بما تشعر به."],["Keep a simple routine: regular sleep, meals and a short walk each day.","Gardez une routine simple : sommeil régulier, repas et une courte promenade chaque jour.","حافظ على روتين بسيط: نوم منتظم ووجبات ومشي قصير كل يوم."],["Do one small activity you used to enjoy, even if you do not feel like it.","Faites une petite activité que vous aimiez, même sans en avoir envie.","قم بنشاط صغير كنت تستمتع به حتى لو لم تكن ترغب في ذلك."],["A counsellor, doctor or psychologist can help. Talking therapy works well.","Un conseiller, un médecin ou un psychologue peut aider. La thérapie par la parole est efficace.","يمكن للمرشد أو الطبيب أو الأخصائي النفسي المساعدة. العلاج بالحديث فعّال."],
["Get help if these feelings last more than 2 weeks, make study or daily life hard, or if you ever think about hurting yourself. If you have those thoughts, tell someone today.","Demandez de l'aide si ces sentiments durent plus de 2 semaines, compliquent les études ou la vie quotidienne, ou si vous pensez un jour à vous faire du mal. Si vous avez ces pensées, parlez-en à quelqu'un aujourd'hui.","اطلب المساعدة إذا استمرت هذه المشاعر أكثر من أسبوعين، أو جعلت الدراسة أو الحياة اليومية صعبة، أو إذا فكرت يوماً في إيذاء نفسك. إذا راودتك هذه الأفكار فأخبر شخصاً اليوم."],
["Anxiety","Anxiété","القلق"],["anxiety","l'anxiété","القلق"],["Worry that is hard to control","Une inquiétude difficile à contrôler","قلق يصعب التحكم فيه"],
["Worry that is hard to control and also shows up in the body, for example a racing heart, a tight chest or stomach pain.","Une inquiétude difficile à contrôler qui se manifeste aussi dans le corps, par exemple un cœur qui s'emballe, une poitrine serrée ou des maux de ventre.","قلق يصعب التحكم فيه ويظهر أيضاً في الجسد، مثل تسارع القلب أو ضيق الصدر أو ألم المعدة."],
["Worrying about many things and finding it hard to stop","S'inquiéter pour beaucoup de choses et avoir du mal à s'arrêter","القلق بشأن أمور كثيرة وصعوبة التوقف"],["Feeling on edge, restless or easily irritated","Se sentir à cran, agité(e) ou facilement irrité(e)","الشعور بالتوتر والتململ وسرعة الانزعاج"],["Muscle tension, headaches or stomach aches","Tensions musculaires, maux de tête ou maux de ventre","توتر العضلات أو الصداع أو آلام المعدة"],["Trouble sleeping or concentrating","Difficulté à dormir ou à se concentrer","صعوبة في النوم أو التركيز"],["Avoiding situations because they cause fear","Éviter des situations parce qu'elles font peur","تجنب مواقف لأنها تثير الخوف"],["Sudden waves of panic","Vagues soudaines de panique","موجات مفاجئة من الذعر"],
["Slow breathing: in for 4 seconds, out for 6, five times.","Respiration lente : inspirez 4 secondes, expirez 6, cinq fois.","تنفس بطيء: شهيق 4 ثوانٍ وزفير 6، خمس مرات."],["Ground yourself: name 5 things you see, 4 you can touch and 3 you hear.","Ancrez-vous : nommez 5 choses que vous voyez, 4 que vous touchez et 3 que vous entendez.","ثبّت نفسك: سمِّ 5 أشياء تراها و4 تلمسها و3 تسمعها."],["Write your worries down, then circle the ones you can act on.","Notez vos inquiétudes, puis entourez celles sur lesquelles vous pouvez agir.","اكتب مخاوفك ثم ضع دائرة حول ما يمكنك التصرف حياله."],["Limit caffeine and energy drinks, and keep a sleep routine.","Limitez la caféine et les boissons énergisantes, et gardez une routine de sommeil.","قلل الكافيين ومشروبات الطاقة والتزم بروتين نوم."],["Face fears in small steps instead of avoiding them.","Affrontez vos peurs par petites étapes au lieu de les éviter.","واجه مخاوفك بخطوات صغيرة بدلاً من تجنبها."],
["Get help if worry is present most days, stops you doing things you need or want to do, or comes with panic attacks.","Demandez de l'aide si l'inquiétude est présente presque tous les jours, vous empêche de faire ce que vous devez ou voulez faire, ou s'accompagne de crises de panique.","اطلب المساعدة إذا كان القلق حاضراً معظم الأيام، أو يمنعك من فعل ما تحتاجه أو تريده، أو يأتي مع نوبات ذعر."],
["ADHD and attention","TDAH et attention","اضطراب فرط الحركة وتشتت الانتباه"],["adhd and attention","le TDAH et l'attention","اضطراب فرط الحركة وتشتت الانتباه"],["Focus, organization, restlessness","Concentration, organisation, agitation","التركيز والتنظيم والتململ"],
["ADHD is a difference in how the brain manages attention, activity and impulse control. It starts in childhood and shows up in more than one place, such as school and home. Only a qualified professional can diagnose it.","Le TDAH est une différence dans la façon dont le cerveau gère l'attention, l'activité et le contrôle des impulsions. Il commence dans l'enfance et se manifeste dans plusieurs contextes, comme l'école et la maison. Seul un professionnel qualifié peut le diagnostiquer.","اضطراب فرط الحركة وتشتت الانتباه اختلاف في طريقة إدارة الدماغ للانتباه والنشاط والتحكم في الاندفاع. يبدأ في الطفولة ويظهر في أكثر من مكان مثل المدرسة والبيت. لا يستطيع تشخيصه إلا مختص مؤهل."],
["Trouble keeping attention on tasks or lessons","Difficulté à maintenir l'attention sur les tâches ou les cours","صعوبة في الحفاظ على الانتباه في المهام أو الدروس"],["Losing things, forgetting deadlines or appointments","Perdre des affaires, oublier les échéances ou les rendez-vous","فقدان الأغراض ونسيان المواعيد النهائية أو المواعيد"],["Difficulty organizing work and finishing tasks","Difficulté à organiser son travail et à terminer les tâches","صعوبة في تنظيم العمل وإنهاء المهام"],["Putting off tasks that need long concentration","Remettre à plus tard les tâches qui demandent une longue concentration","تأجيل المهام التي تتطلب تركيزاً طويلاً"],["Fidgeting or feeling restless when sitting still","S'agiter ou se sentir agité(e) quand on reste assis(e)","التململ أو الشعور بعدم الاستقرار عند الجلوس"],["Acting or speaking before thinking, interrupting others","Agir ou parler avant de réfléchir, interrompre les autres","التصرف أو الكلام قبل التفكير ومقاطعة الآخرين"],
["Break work into small steps with a timer, for example 25 minutes of work and a 5-minute break.","Découpez le travail en petites étapes avec un minuteur, par exemple 25 minutes de travail et 5 minutes de pause.","قسّم العمل إلى خطوات صغيرة مع مؤقت، مثلاً 25 دقيقة عمل و5 دقائق راحة."],["Use lists, phone reminders and a visible weekly planner.","Utilisez des listes, des rappels sur téléphone et un planning hebdomadaire visible.","استخدم القوائم وتذكيرات الهاتف ومخططاً أسبوعياً ظاهراً."],["Study in a quiet place with your phone out of reach.","Étudiez dans un endroit calme, téléphone hors de portée.","ادرس في مكان هادئ مع إبقاء هاتفك بعيداً."],["Move your body: short walks and sport help focus.","Bougez : de courtes promenades et le sport aident à se concentrer.","حرّك جسدك: المشي القصير والرياضة يساعدان على التركيز."],["Ask teachers about seating, extra time or written instructions.","Demandez aux professeurs une place adaptée, du temps supplémentaire ou des consignes écrites.","اسأل الأساتذة عن مكان الجلوس أو الوقت الإضافي أو التعليمات المكتوبة."],
["Poor sleep, stress, anxiety and low mood can look like ADHD, so a professional should look at the whole picture. Ask for an evaluation if attention problems have lasted for months and affect school or home.","Le mauvais sommeil, le stress, l'anxiété et l'humeur basse peuvent ressembler au TDAH ; un professionnel doit donc examiner l'ensemble. Demandez une évaluation si les problèmes d'attention durent depuis des mois et affectent l'école ou la maison.","قد تشبه قلة النوم والتوتر والقلق والمزاج المنخفض اضطراب فرط الحركة وتشتت الانتباه، لذا ينبغي أن ينظر مختص إلى الصورة كاملة. اطلب تقييماً إذا استمرت مشاكل الانتباه لأشهر وأثرت في المدرسة أو البيت."],
["Exam stress and burnout","Stress des examens et épuisement","توتر الامتحانات والإرهاق"],["exam stress and burnout","le stress des examens et l'épuisement","توتر الامتحانات والإرهاق"],["Drained by study demands","Épuisé(e) par les exigences des études","منهَك من متطلبات الدراسة"],
["Feeling exhausted and overloaded by study demands for a long time, not only before an exam.","Se sentir épuisé(e) et surchargé(e) par les exigences des études pendant longtemps, pas seulement avant un examen.","الشعور بالإرهاق والعبء الزائد من متطلبات الدراسة لفترة طويلة وليس فقط قبل الامتحان."],
["Exhaustion that sleep does not fix","Un épuisement que le sommeil ne répare pas","إرهاق لا يعالجه النوم"],["Dreading classes or feeling they are pointless","Redouter les cours ou les trouver inutiles","الخوف من الحصص أو الشعور بأنها بلا جدوى"],["Lower grades despite working harder","Des notes plus basses malgré plus d'efforts","درجات أقل رغم بذل جهد أكبر"],["Headaches, stomach aches or getting ill often","Maux de tête, maux de ventre ou maladies fréquentes","صداع أو آلام معدة أو مرض متكرر"],["Feeling cynical or detached","Se sentir cynique ou détaché(e)","الشعور بالسخرية أو الانفصال"],
["Plan the week and keep one real day off.","Planifiez la semaine et gardez un vrai jour de repos.","خطط للأسبوع واحتفظ بيوم راحة حقيقي."],["Study in short blocks with breaks.","Étudiez par courtes sessions avec des pauses.","ادرس في فترات قصيرة مع استراحات."],["Aim for 8 hours of sleep or more.","Visez 8 heures de sommeil ou plus.","اسعَ إلى 8 ساعات نوم أو أكثر."],["Ask teachers about spreading deadlines.","Demandez aux professeurs d'étaler les échéances.","اسأل الأساتذة عن توزيع المواعيد النهائية."],["Keep one activity that is only for fun.","Gardez une activité uniquement pour le plaisir.","احتفظ بنشاط واحد للمتعة فقط."],
["If exhaustion lasts for weeks or you can no longer cope with your studies, talk to a counsellor.","Si l'épuisement dure des semaines ou si vous n'arrivez plus à gérer vos études, parlez à un conseiller.","إذا استمر الإرهاق أسابيع أو لم تعد قادراً على التعامل مع دراستك فتحدث مع مرشد."],
["Sleep problems","Problèmes de sommeil","مشاكل النوم"],["sleep problems","les problèmes de sommeil","مشاكل النوم"],["Hard to fall or stay asleep","Difficile de s'endormir ou de rester endormi(e)","صعوبة النوم أو البقاء نائماً"],
["Poor sleep lowers mood, focus and patience within a few days, and it makes stress and anxiety harder to handle.","Un mauvais sommeil abaisse l'humeur, la concentration et la patience en quelques jours, et rend le stress et l'anxiété plus difficiles à gérer.","يخفض النوم السيئ المزاج والتركيز والصبر خلال أيام قليلة، ويجعل التوتر والقلق أصعب في التعامل."],
["Taking more than 30 minutes to fall asleep","Mettre plus de 30 minutes à s'endormir","استغراق أكثر من 30 دقيقة للنوم"],["Waking in the night or very early","Se réveiller la nuit ou très tôt","الاستيقاظ ليلاً أو في وقت مبكر جداً"],["Feeling tired all day","Se sentir fatigué(e) toute la journée","الشعور بالتعب طوال اليوم"],["Using the phone in bed late at night","Utiliser le téléphone au lit tard le soir","استخدام الهاتف في السرير ليلاً"],
["Keep a fixed bedtime and wake time, also at weekends.","Gardez des heures de coucher et de réveil fixes, y compris le week-end.","حافظ على وقت ثابت للنوم والاستيقاظ حتى في عطلة نهاية الأسبوع."],["No screens for the last hour before sleeping.","Pas d'écrans pendant la dernière heure avant de dormir.","لا شاشات في الساعة الأخيرة قبل النوم."],["Avoid caffeine after midday.","Évitez la caféine après midi.","تجنب الكافيين بعد الظهر."],["Keep the room dark, quiet and cool.","Gardez la chambre sombre, calme et fraîche.","اجعل الغرفة مظلمة وهادئة وباردة."],["Write tomorrow's tasks down before bed so your mind can rest.","Notez les tâches de demain avant de dormir pour que votre esprit se repose.","اكتب مهام الغد قبل النوم ليرتاح عقلك."],
["If sleep problems last more than 3 weeks, or you snore loudly and stop breathing for moments, see a doctor.","Si les problèmes de sommeil durent plus de 3 semaines, ou si vous ronflez fort et arrêtez de respirer par moments, consultez un médecin.","إذا استمرت مشاكل النوم أكثر من 3 أسابيع، أو كنت تشخر بصوت عالٍ وتتوقف عن التنفس لحظات، فراجع طبيباً."],
["Loneliness","Solitude","الوحدة"],["loneliness","la solitude","الوحدة"],["Feeling left out","Se sentir mis(e) à l'écart","الشعور بالإقصاء"],
["Feeling alone or left out, even when other people are around. It is common and it can be changed.","Se sentir seul(e) ou mis(e) à l'écart, même entouré(e) d'autres personnes. C'est courant et cela peut changer.","الشعور بالوحدة أو الإقصاء حتى وسط الآخرين. هذا شائع ويمكن تغييره."],
["Feeling left out in a group","Se sentir mis(e) à l'écart dans un groupe","الشعور بالإقصاء داخل مجموعة"],["Spending breaks or meals alone","Passer les pauses ou les repas seul(e)","قضاء الاستراحات أو الوجبات وحيداً"],["Avoiding group work or activities","Éviter le travail de groupe ou les activités","تجنب العمل الجماعي أو الأنشطة"],["Feeling nobody understands you","Avoir l'impression que personne ne vous comprend","الشعور بأن لا أحد يفهمك"],
["Ask a teacher for a clear role in group work.","Demandez à un professeur un rôle clair dans le travail de groupe.","اطلب من أستاذ دوراً واضحاً في العمل الجماعي."],["Tell someone how you feel.","Dites à quelqu'un ce que vous ressentez.","أخبر شخصاً بما تشعر به."],
["If loneliness comes with low mood that lasts, talk to a counsellor.","Si la solitude s'accompagne d'une humeur basse qui dure, parlez à un conseiller.","إذا ترافقت الوحدة مع مزاج منخفض مستمر فتحدث مع مرشد."],
["Being targeted or excluded","Être ciblé(e) ou exclu(e)","التعرض للاستهداف أو الإقصاء"],["Repeated unkind behavior, threats or exclusion, in person or online. It is never your fault.","Comportements méchants répétés, menaces ou exclusion, en personne ou en ligne. Ce n'est jamais votre faute.","سلوك مؤذٍ متكرر أو تهديدات أو إقصاء، حضورياً أو عبر الإنترنت. ليس ذلك خطأك أبداً."],
["Being teased, threatened or left out again and again","Être taquiné(e), menacé(e) ou laissé(e) de côté encore et encore","التعرض للسخرية أو التهديد أو الإقصاء مراراً"],["Avoiding break time or certain places","Éviter les pauses ou certains endroits","تجنب الاستراحات أو أماكن معينة"],["Not wanting to go to class","Ne pas vouloir aller en classe","عدم الرغبة في الذهاب إلى الفصل"],["Messages or posts meant to hurt you","Messages ou publications destinés à vous blesser","رسائل أو منشورات تهدف إلى إيذائك"],
["Tell a teacher, a counsellor or the director you trust.","Parlez-en à un professeur, à un conseiller ou au directeur en qui vous avez confiance.","أخبر أستاذاً أو مرشداً أو المدير الذي تثق به."],["Keep screenshots or notes of what happened, where and when.","Gardez des captures d'écran ou des notes de ce qui s'est passé, où et quand.","احتفظ بلقطات شاشة أو ملاحظات عمّا حدث وأين ومتى."],["Do not answer back or take revenge.","Ne ripostez pas et ne cherchez pas à vous venger.","لا ترد بالمثل ولا تنتقم."],
["Tell your school as soon as you can, especially if you feel unsafe.","Informez votre école dès que possible, surtout si vous ne vous sentez pas en sécurité.","أخبر مدرستك في أقرب وقت، خاصة إذا كنت لا تشعر بالأمان."],
["Common questions","Questions fréquentes","أسئلة شائعة"],["Reaching out can feel like a big step. Here is what students often ask.","Demander de l'aide peut sembler un grand pas. Voici ce que les étudiants demandent souvent.","قد يبدو طلب المساعدة خطوة كبيرة. إليك ما يسأل عنه الطلاب غالباً."],["Find a helpline near you","Trouver une ligne d'aide près de chez vous","ابحث عن خط مساعدة قريب منك"],
["Need help right now?","Besoin d'aide tout de suite ?","هل تحتاج إلى مساعدة الآن؟"],["If you are in danger or think you might hurt yourself, get help now. You can also reach out to someone you trust today.","Si vous êtes en danger ou pensez pouvoir vous faire du mal, demandez de l'aide maintenant. Vous pouvez aussi vous tourner vers quelqu'un de confiance aujourd'hui.","إذا كنت في خطر أو تظن أنك قد تؤذي نفسك فاطلب المساعدة الآن. يمكنك أيضاً التواصل مع شخص تثق به اليوم."],
["How do I know if I need professional help?","Comment savoir si j'ai besoin d'une aide professionnelle ?","كيف أعرف أنني بحاجة إلى مساعدة مختص؟"],
["A good sign is when low mood, worry or poor sleep lasts more than two weeks, or starts to get in the way of your studies, friendships or daily life. You do not have to wait until things are \"bad enough\". If you are unsure, a short chat with a counsellor or a doctor is a good way to find out.","Un bon signe est lorsque l'humeur basse, l'inquiétude ou le mauvais sommeil durent plus de deux semaines ou commencent à gêner vos études, vos amitiés ou votre vie quotidienne. Vous n'avez pas à attendre que ce soit « assez grave ». En cas de doute, une courte discussion avec un conseiller ou un médecin est un bon moyen de le savoir.","من العلامات الجيدة أن يستمر المزاج المنخفض أو القلق أو سوء النوم أكثر من أسبوعين، أو أن يبدأ بالتأثير في دراستك أو صداقاتك أو حياتك اليومية. لا يلزمك الانتظار حتى تصبح الأمور \"سيئة بما يكفي\". إذا لم تكن متأكداً فمحادثة قصيرة مع مرشد أو طبيب طريقة جيدة لمعرفة ذلك."],
["Will anyone find out if I ask for help?","Quelqu'un le saura-t-il si je demande de l'aide ?","هل سيعرف أحد إذا طلبت المساعدة؟"],
["Counsellors and doctors keep what you say private. The exception is when someone is at risk of serious harm, and then they involve other adults to keep you safe. On StuWell you do not need an account: your check-ins stay in this browser unless you turn on sharing in your profile, and you can clear them at any time from the Check-in tab.","Les conseillers et les médecins gardent confidentiel ce que vous dites. L'exception est lorsqu'une personne risque un préjudice grave ; ils font alors intervenir d'autres adultes pour vous protéger. Sur StuWell, aucun compte n'est nécessaire : vos bilans restent dans ce navigateur, sauf si vous activez le partage dans votre profil, et vous pouvez les effacer à tout moment depuis l'onglet Bilan.","يحافظ المرشدون والأطباء على سرية ما تقوله. الاستثناء هو عندما يكون شخص ما معرضاً لخطر جسيم، وعندها يُشركون بالغين آخرين لحمايتك. في StuWell لا تحتاج إلى حساب: تبقى تقييماتك في هذا المتصفح ما لم تفعّل المشاركة في ملفك، ويمكنك مسحها في أي وقت من قسم تقييم الحالة."],
["What do I say when I reach out?","Que dire quand je demande de l'aide ?","ماذا أقول عندما أطلب المساعدة؟"],
["Keep it simple. You could say: \"I have been feeling low and I would like to talk to someone.\" You do not need to explain everything at once. The person listening will ask questions to help. The message builder on this page can write a first message for you.","Restez simple. Vous pourriez dire : « Je me sens mal ces derniers temps et j'aimerais parler à quelqu'un. » Vous n'avez pas à tout expliquer d'un coup. La personne qui vous écoute posera des questions pour vous aider. Le générateur de messages de cette page peut écrire un premier message pour vous.","اجعل الأمر بسيطاً. يمكنك أن تقول: \"أشعر بالإحباط مؤخراً وأود التحدث مع شخص ما.\" لا تحتاج إلى شرح كل شيء دفعة واحدة. سيطرح المستمع أسئلة ليساعدك. يمكن لمنشئ الرسائل في هذه الصفحة أن يكتب لك رسالة أولى."],
["How does a medical request work?","Comment fonctionne une demande médicale ?","كيف يعمل الطلب الطبي؟"],
["In the Medical request tab you choose what you need, add dates and a few details, and StuWell writes the request for you. You can press send to deliver it to your director and read the reply in the same tab, or copy it into an email and hand it in with your medical certificate. StuWell keeps a list on this device so you can track whether it was sent, approved or declined.","Dans l'onglet Demande médicale, vous choisissez ce dont vous avez besoin, ajoutez des dates et quelques détails, et StuWell rédige la demande pour vous. Vous pouvez appuyer sur envoyer pour la transmettre à votre directeur et lire la réponse dans le même onglet, ou la copier dans un e-mail et la remettre avec votre certificat médical. StuWell garde une liste sur cet appareil pour suivre si elle a été envoyée, approuvée ou refusée.","في قسم الطلب الطبي تختار ما تحتاجه وتضيف التواريخ وبعض التفاصيل ويكتب StuWell الطلب نيابة عنك. يمكنك الضغط على إرسال لإيصاله إلى مديرك وقراءة الرد في القسم نفسه، أو نسخه في بريد إلكتروني وتسليمه مع شهادتك الطبية. يحتفظ StuWell بقائمة على هذا الجهاز لتتابع هل أُرسل أو وُوفق عليه أو رُفض."],
["Is a check-up result a diagnosis?","Un résultat de dépistage est-il un diagnostic ?","هل نتيجة الفحص تشخيص؟"],
["No. The mood, anxiety and attention checks are screening questionnaires. They show whether it is worth talking to a professional. Only a doctor or psychologist can diagnose anything.","Non. Les bilans d'humeur, d'anxiété et d'attention sont des questionnaires de dépistage. Ils montrent s'il vaut la peine de parler à un professionnel. Seul un médecin ou un psychologue peut poser un diagnostic.","لا. فحوص المزاج والقلق والانتباه استبيانات فرز أولي. توضح ما إذا كان من المفيد التحدث مع مختص. لا يستطيع التشخيص إلا طبيب أو أخصائي نفسي."],
["Is it normal to feel this way?","Est-il normal de se sentir ainsi ?","هل من الطبيعي أن أشعر هكذا؟"],
["Yes. Many students feel stressed, lonely or overwhelmed at some point, especially around exams and big changes. Feeling this way does not mean something is wrong with you, and it is a good reason to ask for support.","Oui. Beaucoup d'étudiants se sentent stressés, seuls ou dépassés à un moment, surtout autour des examens et des grands changements. Se sentir ainsi ne signifie pas que quelque chose ne va pas chez vous, et c'est une bonne raison de demander du soutien.","نعم. يشعر كثير من الطلاب بالتوتر أو الوحدة أو الإرهاق في وقت ما، خاصة قرب الامتحانات والتغيرات الكبيرة. الشعور بهذا لا يعني أن بك عيباً، وهو سبب وجيه لطلب الدعم."],
["What if I am worried about a friend?","Et si je m'inquiète pour un ami ?","ماذا لو كنت قلقاً على صديق؟"],
["Check in with them privately and listen without judging. Let them know you care, and encourage them to talk to a trusted adult. If you think they are in danger, tell a teacher, a counsellor or an adult you trust straight away.","Prenez de leurs nouvelles en privé et écoutez sans juger. Dites-leur que vous tenez à eux et encouragez-les à parler à un adulte de confiance. Si vous pensez qu'ils sont en danger, prévenez immédiatement un professeur, un conseiller ou un adulte de confiance.","اطمئن عليه على انفراد واستمع دون إصدار أحكام. أخبره أنك تهتم به وشجعه على التحدث مع شخص بالغ موثوق. إذا ظننت أنه في خطر فأخبر أستاذاً أو مرشداً أو شخصاً بالغاً تثق به فوراً."],
["How do medical requests work?","Comment fonctionnent les demandes médicales ?","كيف تعمل الطلبات الطبية؟"],

["You are not alone","Vous n'êtes pas seul(e)","لست وحدك"],
["If you are in danger, or you think you might hurt yourself, contact emergency services now or go to the nearest hospital emergency department. If you can, stay with someone.","Si vous êtes en danger, ou pensez pouvoir vous faire du mal, contactez les services d'urgence maintenant ou rendez-vous aux urgences de l'hôpital le plus proche. Si possible, restez avec quelqu'un.","إذا كنت في خطر أو تظن أنك قد تؤذي نفسك فاتصل بخدمات الطوارئ الآن أو توجّه إلى أقرب قسم طوارئ في مستشفى. وإن أمكن فابقَ مع شخص ما."],
["Morocco: emergency","Maroc : urgences","المغرب: الطوارئ"],["Ambulance and SAMU","Ambulance et SAMU","الإسعاف و SAMU"],["Police","Police","الشرطة"],["Gendarmerie Royale","Gendarmerie Royale","الدرك الملكي"],["General emergency","Urgence générale","الطوارئ العامة"],
["Some sources list different codes for some services. If a number does not connect, try another or go to a hospital.","Certaines sources indiquent des codes différents pour certains services. Si un numéro ne passe pas, essayez-en un autre ou rendez-vous à l'hôpital.","تذكر بعض المصادر أرقاماً مختلفة لبعض الخدمات. إذا لم يتصل رقم فجرّب آخر أو اذهب إلى المستشفى."],
["Morocco: support lines","Maroc : lignes d'écoute","المغرب: خطوط الدعم"],["For women and girls. Free.","Pour les femmes et les filles. Gratuit.","للنساء والفتيات. مجاني."],["For children and young people. Free. Phone line daily, 9:00 to 16:00.","Pour les enfants et les jeunes. Gratuit. Ligne téléphonique tous les jours, de 9h00 à 16h00.","للأطفال والشباب. مجاني. خط هاتفي يومياً من 9:00 إلى 16:00."],
["Hours can change. These lines have specific audiences and are not general crisis lines.","Les horaires peuvent changer. Ces lignes s'adressent à des publics précis et ne sont pas des lignes de crise générales.","قد تتغير الساعات. لهذه الخطوط جمهور محدد وهي ليست خطوط أزمات عامة."],
["Somewhere else","Ailleurs","في مكان آخر"],["Call your local emergency number. You can also look up free helplines for your country.","Appelez votre numéro d'urgence local. Vous pouvez aussi chercher des lignes d'aide gratuites dans votre pays.","اتصل برقم الطوارئ المحلي. يمكنك أيضاً البحث عن خطوط مساعدة مجانية في بلدك."],
["Then tell someone today","Puis parlez-en à quelqu'un aujourd'hui","ثم أخبر شخصاً اليوم"],["A friend, a family member, a tutor or a counsellor. You do not need the perfect words. \"I've been struggling lately\" is enough.","Un ami, un membre de la famille, un tuteur ou un conseiller. Vous n'avez pas besoin des mots parfaits. « J'ai du mal en ce moment » suffit.","صديق أو فرد من العائلة أو مشرف أو مرشد. لا تحتاج إلى كلمات مثالية. \"أمرّ بوقت صعب مؤخراً\" تكفي."],

["Stays on your device","Reste sur votre appareil","يبقى على جهازك"],["Your check-ins, screener scores, saved requests and settings are stored in this browser only. Your individual screener answers and the worry dump are never stored.","Vos bilans, scores de dépistage, demandes enregistrées et réglages sont stockés uniquement dans ce navigateur. Vos réponses individuelles aux questionnaires et la décharge d'inquiétudes ne sont jamais enregistrées.","تُخزَّن تقييماتك ونتائج الاستبيانات وطلباتك المحفوظة وإعداداتك في هذا المتصفح فقط. لا تُخزَّن إجاباتك الفردية على الاستبيانات ولا تفريغ القلق أبداً."],
["Shared only if you choose","Partagé uniquement si vous le choisissez","يُشارك فقط إذا اخترت ذلك"],["If you turn on sharing in My profile and sharing, school staff with Editor access can see your name, school, year, class, check-in scores and flags, and screener scores. A medical request is shared only when you press send. Free text from check-ins is never shared. You can switch sharing off at any time.","Si vous activez le partage dans Mon profil et le partage, le personnel de l'école ayant un accès Éditeur peut voir votre nom, votre école, votre année, votre classe, vos scores et signalements de bilan, et vos scores de dépistage. Une demande médicale n'est partagée que lorsque vous appuyez sur envoyer. Le texte libre des bilans n'est jamais partagé. Vous pouvez désactiver le partage à tout moment.","إذا فعّلت المشاركة في ملفي والمشاركة فيمكن لموظفي المدرسة الذين لديهم صلاحية التحرير رؤية اسمك ومدرستك وسنتك وفصلك ونتائج تقييماتك وإشاراتها ونتائج الاستبيانات. لا يُشارك الطلب الطبي إلا عند الضغط على إرسال. لا تُشارك النصوص الحرة من التقييمات أبداً. يمكنك إيقاف المشاركة في أي وقت."],
["Please remember","À ne pas oublier","يرجى التذكر"],["StuWell is not watched in real time and is not a replacement for a doctor, a psychologist or a counsellor. If you are in danger, use Help now.","StuWell n'est pas surveillé en temps réel et ne remplace pas un médecin, un psychologue ou un conseiller. Si vous êtes en danger, utilisez Aide immédiate.","لا تتم مراقبة StuWell في الوقت الفعلي وهو ليس بديلاً عن الطبيب أو الأخصائي النفسي أو المرشد. إذا كنت في خطر فاستخدم مساعدة فورية."],
["Profile and sharing","Profil et partage","الملف والمشاركة"],["Your name, school, year and class help staff know who a request or check-in is from. It is optional unless you share or send something.","Votre nom, votre école, votre année et votre classe aident le personnel à savoir de qui vient une demande ou un bilan. C'est facultatif sauf si vous partagez ou envoyez quelque chose.","يساعد اسمك ومدرستك وسنتك وفصلك الموظفين على معرفة صاحب الطلب أو التقييم. وهو اختياري ما لم تشارك أو ترسل شيئاً."],
["Your name","Votre nom","اسمك"],["Class or program","Classe ou filière","الفصل أو البرنامج"],["Let my school see how I am doing","Permettre à mon école de voir comment je vais","السماح لمدرستي برؤية حالي"],
["Staff can see my name, school, year, class, check-in scores and screener scores, never my free text. I can turn this off at any time.","Le personnel peut voir mon nom, mon école, mon année, ma classe, mes scores de bilan et de dépistage, jamais mon texte libre. Je peux le désactiver à tout moment.","يمكن للموظفين رؤية اسمي ومدرستي وسنتي وفصلي ونتائج تقييماتي واستبياناتي، ولا يرون نصوصي الحرة أبداً. يمكنني إيقاف ذلك في أي وقت."],
["Sharing is off in this view. It works when you open StuWell through the link your school gave you.","Le partage est désactivé dans cette vue. Il fonctionne lorsque vous ouvrez StuWell via le lien donné par votre école.","المشاركة متوقفة في هذا العرض. تعمل عند فتح StuWell عبر الرابط الذي زودتك به مدرستك."],
["StuWell is not watched in real time. If you need help now, use Help now or talk to someone you trust.","StuWell n'est pas surveillé en temps réel. Si vous avez besoin d'aide maintenant, utilisez Aide immédiate ou parlez à quelqu'un de confiance.","لا تتم مراقبة StuWell في الوقت الفعلي. إذا كنت تحتاج إلى مساعدة الآن فاستخدم مساعدة فورية أو تحدث مع شخص تثق به."],

["StuWell helps students notice how they really feel, calm down in two minutes, and reach the right person. It gives directors a clear, respectful view of who needs support.","StuWell aide les étudiants à remarquer ce qu'ils ressentent vraiment, à se calmer en deux minutes et à joindre la bonne personne. Il donne aux directeurs une vue claire et respectueuse de qui a besoin de soutien.","يساعد StuWell الطلاب على ملاحظة ما يشعرون به حقاً والهدوء خلال دقيقتين والوصول إلى الشخص المناسب. ويمنح المديرين رؤية واضحة ومحترمة لمن يحتاج إلى دعم."],

["What is inside","Ce qu'il y a dedans","ما بداخله"],["Everything a student needs, in one calm place.","Tout ce dont un étudiant a besoin, dans un endroit apaisant.","كل ما يحتاجه الطالب في مكان هادئ واحد."],
["Built around what students need most: a weather-style check-in, validated screeners for well-being, mood, anxiety, stress, self-esteem, distress and attention, and medical requests that reach your director.","Construit autour de ce dont les étudiants ont le plus besoin : un bilan façon météo, des questionnaires validés sur le bien-être, l'humeur, l'anxiété, le stress, l'estime de soi, la détresse et l'attention, et des demandes médicales qui parviennent à votre directeur.","مبني حول أكثر ما يحتاجه الطلاب: تقييم على طريقة الطقس، واستبيانات معتمدة للرفاهية والمزاج والقلق والتوتر وتقدير الذات والضيق النفسي والانتباه، وطلبات طبية تصل إلى مديرك."],
